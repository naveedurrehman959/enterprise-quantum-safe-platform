name: Deploy Quantum-Safe Platform

on:
  workflow_run:
    workflows:
      - "Enterprise Quantum-Safe DevSecOps"
    types:
      - completed

permissions:
  contents: read

jobs:

  deploy-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (
        github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'master'
      )

    steps:

      # ======================================================
      # 1. Checkout EXACT commit approved by DevSecOps
      # ======================================================

      - name: Checkout Approved Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # ======================================================
      # 2. Configure SSH
      # ======================================================

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # ======================================================
      # 3. Add EC2 to Known Hosts
      # ======================================================

      - name: Add EC2 to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      # ======================================================
      # 4. Prepare EC2 directories
      # ======================================================

      - name: Prepare EC2 Deployment Directory
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

            sudo mkdir -p /opt/quantum-safe
            sudo mkdir -p /opt/quantum-safe/nginx
            sudo mkdir -p /opt/quantum-safe/nginx/ssl
            sudo mkdir -p /opt/quantum-safe/prometheus

            sudo chown -R ubuntu:ubuntu /opt/quantum-safe

          EOF

      # ======================================================
      # 5. Configure Deployment Environment
      # ======================================================

      - name: Configure Deployment Environment
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

        run: |

          set -e

          cat > .env.deploy <<EOF
          POSTGRES_DB=${DB_NAME}
          POSTGRES_USER=${DB_USER}
          POSTGRES_PASSWORD=${DB_PASSWORD}
          IMAGE_TAG=${IMAGE_TAG}
          EOF

          chmod 600 .env.deploy

          scp .env.deploy \
            ubuntu@${{ secrets.EC2_HOST }}:/opt/quantum-safe/.env

          ssh ubuntu@${{ secrets.EC2_HOST }} \
            "chmod 600 /opt/quantum-safe/.env"

          rm -f .env.deploy

          echo "Deployment environment configured on EC2."

      # ======================================================
      # 6. Copy Docker Compose
      # ======================================================

      - name: Copy Docker Compose
        run: |
          scp docker-compose.yml \
            ubuntu@${{ secrets.EC2_HOST }}:/opt/quantum-safe/docker-compose.yml

      # ======================================================
      # 7. Copy Nginx Configuration
      # ======================================================

      - name: Copy Nginx Configuration
        run: |
          scp -r nginx/* \
            ubuntu@${{ secrets.EC2_HOST }}:/opt/quantum-safe/nginx/

      # ======================================================
      # 8. Copy Prometheus Configuration
      # ======================================================

      - name: Copy Prometheus Configuration
        run: |
          scp -r prometheus/* \
            ubuntu@${{ secrets.EC2_HOST }}:/opt/quantum-safe/prometheus/

      # ======================================================
      # 9. Validate Docker Compose
      # ======================================================

      - name: Validate Docker Compose
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            cd /opt/quantum-safe

            echo "=========================================="
            echo "VALIDATING DOCKER COMPOSE"
            echo "=========================================="

            docker compose config > /tmp/quantum-safe-compose-rendered.yml

            echo "Docker Compose configuration is valid."

          EOF

      # ======================================================
      # 10. Pull Approved Images
      # ======================================================

      - name: Pull Docker Images
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            cd /opt/quantum-safe

            echo "Pulling approved images..."

            docker compose pull

          EOF

      # ======================================================
      # 11. Deploy Application
      # ======================================================

      - name: Deploy Application
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            cd /opt/quantum-safe

            echo "Deploying application..."

            docker compose up -d

          EOF

      # ======================================================
      # 12. Wait for Containers
      # ======================================================

      - name: Wait for Containers
        run: |
          echo "Waiting for containers to start..."
          sleep 20

      # ======================================================
      # 13. Check Container Status
      # ======================================================

      - name: Check Container Status
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

            cd /opt/quantum-safe

            echo "=========================================="
            echo "CONTAINER STATUS"
            echo "=========================================="

            docker compose ps

            echo ""
            echo "=========================================="
            echo "DEPLOYED APPLICATION IMAGES"
            echo "=========================================="

            docker images | grep enterprise-quantum-safe || true

          EOF

      # ======================================================
      # 14. Application Health Check
      # ======================================================

      - name: Application Health Check
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            echo "=========================================="
            echo "APPLICATION HEALTH CHECK"
            echo "=========================================="

            for i in {1..10}; do

              if curl -f -s http://localhost/ > /dev/null; then

                echo ""
                echo "Application is healthy."
                echo "Health check PASSED."

                exit 0

              fi

              echo "Attempt $i/10 failed."
              echo "Waiting 5 seconds..."

              sleep 5

            done

            echo ""
            echo "=========================================="
            echo "HEALTH CHECK FAILED"
            echo "=========================================="

            cd /opt/quantum-safe

            docker compose ps

            echo ""
            echo "=========================================="
            echo "CONTAINER LOGS"
            echo "=========================================="

            docker compose logs --tail=100

            exit 1

          EOF

      # ======================================================
      # 15. Deployment Summary
      # ======================================================

      - name: Deployment Summary
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}

        run: |

          echo "=========================================="
          echo "AWS EC2 DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "Commit:"
          echo "${DEPLOYED_SHA}"

          echo ""
          echo "Backend:"
          echo "naveedurehman/enterprise-quantum-safe-backend:${DEPLOYED_SHA}"

          echo ""
          echo "Frontend:"
          echo "naveedurehman/enterprise-quantum-safe-frontend:${DEPLOYED_SHA}"

          echo ""
          echo "EC2:"
          echo "${{ secrets.EC2_HOST }}"

          echo ""
          echo "Deployment directory:"
          echo "/opt/quantum-safe"

          echo ""
          echo "=========================================="
          echo "DEPLOYMENT COMPLETE"
          echo "=========================================="
