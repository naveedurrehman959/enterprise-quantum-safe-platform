
name: Enterprise Quantum-Safe DevSecOps

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PREFIX: ghcr.io/naveedurrehman959/enterprise-quantum-safe-platform

  DOCKERHUB_IMAGE_PREFIX: naveedurehman/enterprise-quantum-safe

  BACKEND_IMAGE: enterprise-quantum-safe-backend
  FRONTEND_IMAGE: enterprise-quantum-safe-frontend


jobs:

  # ============================================================
  # 1. DEPENDENCY REVIEW
  # ============================================================

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high


  # ============================================================
  # 2. SECRET SCANNING
  # ============================================================

  secret-scan:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 3. SAST - SEMGREP
  # ============================================================

  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            backend \
            frontend


  # ============================================================
  # 4. SAST - BANDIT
  # ============================================================

  bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r backend/app -ll


  # ============================================================
  # 5. BACKEND SCA
  # ============================================================

  backend-sca:
    name: Backend SCA - pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        run: |
          pip-audit -r requirements.txt


  # ============================================================
  # 6. FRONTEND SCA
  # ============================================================

  frontend-sca:
    name: Frontend SCA - npm audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=high


  # ============================================================
  # 7. BACKEND TESTS
  # ============================================================

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest -q tests


  # ============================================================
  # 8. FRONTEND LINT + BUILD
  # ============================================================

  frontend-validation:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: ESLint
        run: |
          npm run lint

      - name: Build React Application
        run: |
          npm run build


  # ============================================================
  # 9. SBOM
  # ============================================================

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-quantum-safe-sbom
          path: sbom-cyclonedx.json


  # ============================================================
  # 10. IaC / CONFIGURATION SCANNING
  # ============================================================

  iac-scan:
    name: IaC and Configuration Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trivy Configuration Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true


  # ============================================================
  # 11. DOCKER BUILD
  # ============================================================

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - semgrep
      - bandit
      - backend-sca
      - frontend-sca
      - backend-tests
      - frontend-validation
      - iac-scan
      - sbom

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ./frontend

      - name: Save Docker Images
        run: |
          docker save \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -o docker-images.tar

      - name: Upload Docker Images
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-docker-images
          path: docker-images.tar


  # ============================================================
  # 12. CONTAINER SECURITY SCANNING
  #
  # TRIVY POLICY: WARNING ONLY
  # ============================================================

  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-docker-images

      - name: Load Docker Images
        run: |
          docker load -i docker-images.tar

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: enterprise-quantum-safe-backend:${{ github.sha }}
          scanners: vuln
          pkg-types: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: enterprise-quantum-safe-frontend:${{ github.sha }}
          scanners: vuln
          pkg-types: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table


  # ============================================================
  # 13. PUBLISH IMAGES
  # ============================================================

  publish-images:
    name: Publish Images to GHCR and Docker Hub
    runs-on: ubuntu-latest

    needs:
      - container-scan

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-docker-images

      - name: Load Docker Images
        run: |
          docker load -i docker-images.tar


      # --------------------------------------------------------
      # GHCR LOGIN
      # --------------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # DOCKER HUB LOGIN
      # --------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------------
      # VERIFY DOCKER HUB LOGIN
      # --------------------------------------------------------

      - name: Verify Docker Hub Login
        run: |
          echo "Docker Hub authentication completed."
          echo "Docker Hub username: ${{ secrets.DOCKERHUB_USERNAME }}"


      # --------------------------------------------------------
      # TAG IMAGES
      # --------------------------------------------------------

      - name: Tag Images
        run: |
          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ github.sha }}

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ github.sha }}

          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-backend:${{ github.sha }}

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-frontend:${{ github.sha }}


      # --------------------------------------------------------
      # PUSH BACKEND TO GHCR
      # --------------------------------------------------------

      - name: Push Backend to GHCR
        run: |
          docker push \
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ github.sha }}


      # --------------------------------------------------------
      # PUSH FRONTEND TO GHCR
      # --------------------------------------------------------

      - name: Push Frontend to GHCR
        run: |
          docker push \
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ github.sha }}


      # --------------------------------------------------------
      # PUSH BACKEND TO DOCKER HUB
      # --------------------------------------------------------

      - name: Push Backend to Docker Hub
        run: |
          docker push \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-backend:${{ github.sha }}


      # --------------------------------------------------------
      # PUSH FRONTEND TO DOCKER HUB
      # --------------------------------------------------------

      - name: Push Frontend to Docker Hub
        run: |
          docker push \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-frontend:${{ github.sha }}

  # ============================================================
  # 14. DEPLOY TO AWS EC2
  # ============================================================

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs:
      - publish-images

    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    steps:

      # --------------------------------------------------------
      # Validate EC2 configuration
      # --------------------------------------------------------

      - name: Validate EC2 Configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_PRIVATE_KEY: ${{ secrets.TLS_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "VALIDATING DEPLOYMENT SECRETS"
          echo "=========================================="

          REQUIRED_VARS=(
            EC2_HOST
            EC2_USERNAME
            EC2_SSH_KEY
            DOCKERHUB_USERNAME
            DOCKERHUB_TOKEN
            POSTGRES_DB
            POSTGRES_USER
            POSTGRES_PASSWORD
            TLS_CERT
            TLS_PRIVATE_KEY
          )

          for var in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: Required secret is empty: $var"
              exit 1
            fi
          done

          echo "All required deployment secrets are present."


      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Configure SSH
      # --------------------------------------------------------

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CONFIGURING SSH"
          echo "=========================================="

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          if ! ssh-keygen -y \
            -f "$HOME/.ssh/deploy_key" \
            > /dev/null 2>&1; then

            echo "ERROR: Invalid EC2 SSH private key."
            exit 1
          fi

          echo "SSH private key is valid."

          ssh-keyscan \
            -T 15 \
            -H "$EC2_HOST" \
            > "$HOME/.ssh/known_hosts"

          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "ERROR: Could not obtain EC2 host key."
            exit 1
          fi

          chmod 644 "$HOME/.ssh/known_hosts"

          echo "SSH configuration completed."


      # --------------------------------------------------------
      # Prepare deployment directory
      # --------------------------------------------------------

      - name: Prepare EC2 Deployment Directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "PREPARING EC2 DEPLOYMENT DIRECTORY"
          echo "=========================================="

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USERNAME@$EC2_HOST" \
            'mkdir -p "$HOME/enterprise-quantum-safe-platform/docker/nginx/ssl" "$HOME/enterprise-quantum-safe-platform/monitoring/prometheus"'

          echo "Deployment directories created."


      # --------------------------------------------------------
      # Copy Docker Compose file
      # --------------------------------------------------------

      - name: Copy Docker Compose File
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "COPYING DOCKER COMPOSE FILE"
          echo "=========================================="

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            docker-compose.yml \
            "$EC2_USERNAME@$EC2_HOST:$HOME/enterprise-quantum-safe-platform/docker-compose.yml"

          echo "docker-compose.yml copied successfully."


      # --------------------------------------------------------
      # Copy Nginx configuration
      # --------------------------------------------------------

      - name: Copy Nginx Configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "COPYING NGINX CONFIGURATION"
          echo "=========================================="

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            docker/nginx/default.conf \
            "$EC2_USERNAME@$EC2_HOST:$HOME/enterprise-quantum-safe-platform/docker/nginx/default.conf"

          echo "Nginx configuration copied successfully."


      # --------------------------------------------------------
      # Copy Prometheus configuration
      # --------------------------------------------------------

      - name: Copy Prometheus Configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "COPYING PROMETHEUS CONFIGURATION"
          echo "=========================================="

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            monitoring/prometheus/prometheus.yml \
            "$EC2_USERNAME@$EC2_HOST:$HOME/enterprise-quantum-safe-platform/monitoring/prometheus/prometheus.yml"

          echo "Prometheus configuration copied successfully."


      # --------------------------------------------------------
      # Create deployment environment and TLS files
      # --------------------------------------------------------

      - name: Configure EC2 Environment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}

          IMAGE_TAG: ${{ github.sha }}

          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_PRIVATE_KEY: ${{ secrets.TLS_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CONFIGURING EC2 ENVIRONMENT"
          echo "=========================================="

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$EC2_USERNAME@$EC2_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' \
             DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' \
             DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' \
             POSTGRES_DB='$POSTGRES_DB' \
             POSTGRES_USER='$POSTGRES_USER' \
             POSTGRES_PASSWORD='$POSTGRES_PASSWORD' \
             TLS_CERT='$TLS_CERT' \
             TLS_PRIVATE_KEY='$TLS_PRIVATE_KEY' \
             bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          DEPLOY_DIR="$HOME/enterprise-quantum-safe-platform"

          cd "$DEPLOY_DIR"

          echo "Deployment directory:"
          pwd

          # ------------------------------------------------------
          # Create .env safely
          # ------------------------------------------------------

          umask 077

          printf '%s\n' \
            "IMAGE_TAG=$IMAGE_TAG" \
            "POSTGRES_DB=$POSTGRES_DB" \
            "POSTGRES_USER=$POSTGRES_USER" \
            "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            > .env

          chmod 600 .env

          echo ".env created successfully."

          # ------------------------------------------------------
          # Create TLS files
          # ------------------------------------------------------

          mkdir -p docker/nginx/ssl

          printf '%s\n' "$TLS_CERT" \
            > docker/nginx/ssl/server.crt

          printf '%s\n' "$TLS_PRIVATE_KEY" \
            > docker/nginx/ssl/server.key

          chmod 644 docker/nginx/ssl/server.crt
          chmod 600 docker/nginx/ssl/server.key

          echo "TLS files created successfully."

          REMOTE_SCRIPT


      # --------------------------------------------------------
      # Deploy complete application
      # --------------------------------------------------------

      - name: Deploy Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}

          IMAGE_TAG: ${{ github.sha }}

          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DEPLOYING QUANTUM-SAFE PLATFORM"
          echo "=========================================="

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USERNAME@$EC2_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' \
             DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' \
             DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' \
             bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          DEPLOY_DIR="$HOME/enterprise-quantum-safe-platform"

          cd "$DEPLOY_DIR"

          echo "=========================================="
          echo "DEPLOYMENT DIRECTORY"
          echo "=========================================="

          pwd


          # ======================================================
          # VERIFY DOCKER
          # ======================================================

          echo "=========================================="
          echo "VERIFYING DOCKER"
          echo "=========================================="

          docker --version
          docker compose version


          # ======================================================
          # VERIFY REQUIRED FILES
          # ======================================================

          echo "=========================================="
          echo "VERIFYING DEPLOYMENT FILES"
          echo "=========================================="

          REQUIRED_FILES=(
            "docker-compose.yml"
            "docker/nginx/default.conf"
            "docker/nginx/ssl/server.crt"
            "docker/nginx/ssl/server.key"
            "monitoring/prometheus/prometheus.yml"
            ".env"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi
          done

          echo "All deployment files are present."


          # ======================================================
          # DOCKER HUB LOGIN
          # ======================================================

          echo "=========================================="
          echo "LOGGING INTO DOCKER HUB"
          echo "=========================================="

          printf '%s\n' "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

          echo "Docker Hub login successful."


          # ======================================================
          # VALIDATE TLS
          # ======================================================

          echo "=========================================="
          echo "VALIDATING TLS"
          echo "=========================================="

          openssl x509 \
            -in docker/nginx/ssl/server.crt \
            -noout \
            -subject \
            -issuer \
            -dates

          openssl pkey \
            -in docker/nginx/ssl/server.key \
            -noout

          CERT_KEY_HASH=$(
            openssl x509 \
              -in docker/nginx/ssl/server.crt \
              -pubkey \
              -noout |
            openssl pkey \
              -pubin \
              -outform DER 2>/dev/null |
            sha256sum |
            awk '{print $1}'
          )

          PRIVATE_KEY_HASH=$(
            openssl pkey \
              -in docker/nginx/ssl/server.key \
              -pubout 2>/dev/null |
            openssl pkey \
              -pubin \
              -outform DER 2>/dev/null |
            sha256sum |
            awk '{print $1}'
          )

          if [ "$CERT_KEY_HASH" != "$PRIVATE_KEY_HASH" ]; then
            echo "ERROR: TLS certificate and private key do not match."
            exit 1
          fi

          echo "TLS certificate and private key match."


          # ======================================================
          # VALIDATE COMPOSE
          # ======================================================

          echo "=========================================="
          echo "VALIDATING DOCKER COMPOSE"
          echo "=========================================="

          docker compose config -q

          echo "Docker Compose configuration is valid."


          # ======================================================
          # PULL IMAGES
          # ======================================================

          echo "=========================================="
          echo "PULLING APPLICATION IMAGES"
          echo "=========================================="

          docker compose pull

          echo "Docker images pulled successfully."


          # ======================================================
          # START POSTGRESQL
          # ======================================================

          echo "=========================================="
          echo "STARTING POSTGRESQL"
          echo "=========================================="

          docker compose up -d postgres


          # ======================================================
          # WAIT FOR POSTGRESQL
          # ======================================================

          echo "=========================================="
          echo "WAITING FOR POSTGRESQL"
          echo "=========================================="

          POSTGRES_READY=false

          for i in {1..30}; do

            if docker compose exec -T postgres \
              pg_isready \
              -U "$POSTGRES_USER" \
              -d "$POSTGRES_DB" \
              >/dev/null 2>&1; then

              echo "PostgreSQL is ready."

              POSTGRES_READY=true

              break

            fi

            echo "PostgreSQL not ready yet... attempt $i/30"

            sleep 2

          done

          if [ "$POSTGRES_READY" != "true" ]; then

            echo "ERROR: PostgreSQL failed to become ready."

            docker compose ps -a

            docker compose logs postgres --tail=150 || true

            exit 1

          fi


          # ======================================================
          # START COMPLETE STACK
          # ======================================================

          echo "=========================================="
          echo "STARTING COMPLETE APPLICATION STACK"
          echo "=========================================="

          docker compose up -d --remove-orphans

          echo "Complete stack started."


          # ======================================================
          # WAIT FOR APPLICATION
          # ======================================================

          echo "=========================================="
          echo "WAITING FOR APPLICATION"
          echo "=========================================="

          sleep 15


          # ======================================================
          # DATABASE MIGRATION
          # ======================================================

          echo "=========================================="
          echo "RUNNING DATABASE MIGRATION"
          echo "=========================================="

          docker compose exec -T backend \
            flask db upgrade

          echo "Database migration completed successfully."


          # ======================================================
          # VERIFY SERVICES
          # ======================================================

          echo "=========================================="
          echo "VERIFYING SERVICES"
          echo "=========================================="

          REQUIRED_SERVICES=(
            postgres
            backend
            frontend
            nginx
            prometheus
            grafana
          )

          for service in "${REQUIRED_SERVICES[@]}"; do

            CONTAINER_ID=$(
              docker compose ps -q "$service" 2>/dev/null || true
            )

            if [ -z "$CONTAINER_ID" ]; then

              echo "ERROR: No container exists for service: $service"

              docker compose ps -a

              exit 1

            fi

            STATUS=$(
              docker inspect \
                --format '{{.State.Status}}' \
                "$CONTAINER_ID"
            )

            if [ "$STATUS" != "running" ]; then

              echo "ERROR: Service is not running: $service"
              echo "Current status: $STATUS"

              docker compose logs \
                --tail=150 \
                "$service" || true

              exit 1

            fi

            echo "$service: RUNNING"

          done


          # ======================================================
          # NGINX TEST
          # ======================================================

          echo "=========================================="
          echo "TESTING NGINX"
          echo "=========================================="

          docker compose exec -T nginx nginx -t

          echo "Nginx configuration is valid."


          # ======================================================
          # DATABASE TEST
          # ======================================================

          echo "=========================================="
          echo "TESTING DATABASE"
          echo "=========================================="

          docker compose exec -T postgres \
            psql \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -c "SELECT current_user, current_database();"


          # ======================================================
          # ALEMBIC VERSION
          # ======================================================

          echo "=========================================="
          echo "CHECKING DATABASE MIGRATION"
          echo "=========================================="

          docker compose exec -T postgres \
            psql \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -c "SELECT version_num FROM alembic_version;"


          # ======================================================
          # FINAL STATUS
          # ======================================================

          echo "=========================================="
          echo "FINAL DOCKER COMPOSE STATUS"
          echo "=========================================="

          docker compose ps


          # ======================================================
          # SUCCESS
          # ======================================================

          echo "=========================================="
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=========================================="

          REMOTE_SCRIPT
