name: Enterprise Quantum-Safe DevSecOps

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: enterprise-quantum-safe-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PREFIX: ghcr.io/naveedurrehman959/enterprise-quantum-safe-platform

  DOCKERHUB_IMAGE_PREFIX: naveedurehman/enterprise-quantum-safe

  BACKEND_IMAGE: enterprise-quantum-safe-backend
  FRONTEND_IMAGE: enterprise-quantum-safe-frontend


jobs:

  # ============================================================
  # 1. DEPENDENCY REVIEW
  # ============================================================

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high


  # ============================================================
  # 2. SECRET SCANNING
  # ============================================================

  secret-scan:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 3. SAST - SEMGREP
  # ============================================================

  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            backend \
            frontend


  # ============================================================
  # 4. SAST - BANDIT
  # ============================================================

  bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r backend/app -ll


  # ============================================================
  # 5. BACKEND SCA
  # ============================================================

  backend-sca:
    name: Backend SCA - pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        run: |
          pip-audit -r requirements.txt


  # ============================================================
  # 6. FRONTEND SCA
  # ============================================================

  frontend-sca:
    name: Frontend SCA - npm audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=high


  # ============================================================
  # 7. BACKEND TESTS
  # ============================================================

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest -q tests


  # ============================================================
  # 8. FRONTEND LINT + BUILD
  # ============================================================

  frontend-validation:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: ESLint
        run: |
          npm run lint

      - name: Build React Application
        run: |
          npm run build


  # ============================================================
  # 9. SBOM
  # ============================================================

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-quantum-safe-sbom
          path: sbom-cyclonedx.json


  # ============================================================
  # 10. IaC / CONFIGURATION SCANNING
  # ============================================================

  iac-scan:
    name: IaC and Configuration Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trivy Configuration Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true


  # ============================================================
  # 11. DOCKER BUILD
  # ============================================================

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - semgrep
      - bandit
      - backend-sca
      - frontend-sca
      - backend-tests
      - frontend-validation
      - iac-scan
      - sbom

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ./frontend

      - name: Save Docker Images
        run: |
          docker save \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -o docker-images.tar

      - name: Upload Docker Images
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-docker-images
          path: docker-images.tar


  # ============================================================
  # 12. CONTAINER SECURITY SCANNING
  # ============================================================

  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-docker-images

      - name: Load Docker Images
        run: |
          docker load -i docker-images.tar

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: enterprise-quantum-safe-backend:${{ github.sha }}
          scanners: vuln
          pkg-types: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: enterprise-quantum-safe-frontend:${{ github.sha }}
          scanners: vuln
          pkg-types: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table


  # ============================================================
  # 13. PUBLISH IMAGES
  # ============================================================

  publish-images:
    name: Publish Images to GHCR and Docker Hub
    runs-on: ubuntu-latest

    needs:
      - container-scan

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-docker-images

      - name: Load Docker Images
        run: |
          docker load -i docker-images.tar

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Images
        run: |
          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ github.sha }}

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ github.sha }}

          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-backend:${{ github.sha }}

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-frontend:${{ github.sha }}

      - name: Push Backend to GHCR
        run: |
          docker push \
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Push Frontend to GHCR
        run: |
          docker push \
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ github.sha }}

      - name: Push Backend to Docker Hub
        run: |
          docker push \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Push Frontend to Docker Hub
        run: |
          docker push \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-frontend:${{ github.sha }}


  # ============================================================
  # 14. DEPLOY TO AWS EC2
  # ============================================================

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs:
      - publish-images

    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ========================================================
      # VALIDATE EC2 CONFIGURATION
      # ========================================================

      - name: Validate EC2 Configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$EC2_HOST" || {
            echo "ERROR: EC2_HOST is not configured."
            exit 1
          }

          test -n "$EC2_USERNAME" || {
            echo "ERROR: EC2_USERNAME is not configured."
            exit 1
          }

          test -n "$EC2_SSH_KEY" || {
            echo "ERROR: EC2_SSH_KEY is not configured."
            exit 1
          }

          echo "EC2 configuration detected."


      # ========================================================
      # CONFIGURE SSH
      # ========================================================

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          echo "Validating SSH private key..."

          ssh-keygen -y \
            -f "$HOME/.ssh/deploy_key" \
            > /dev/null

          echo "Checking EC2 port 22..."

          timeout 10 bash -c \
            "</dev/tcp/$EC2_HOST/22"

          echo "Scanning EC2 host key..."

          rm -f "$HOME/.ssh/known_hosts"

          ssh-keyscan \
            -T 15 \
            -p 22 \
            -H \
            "$EC2_HOST" \
            > "$HOME/.ssh/known_hosts"

          chmod 644 "$HOME/.ssh/known_hosts"

          echo "Testing SSH authentication..."

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USERNAME@$EC2_HOST" \
            "echo 'SSH authentication successful.'"


      # ========================================================
      # UPLOAD DEPLOYMENT CONFIGURATION
      # ========================================================

      - name: Upload Deployment Configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -euo pipefail

          echo "Checking deployment files..."

          test -f docker-compose.yml
          test -f docker/nginx/default.conf
          test -f monitoring/prometheus/prometheus.yml

          echo "Creating EC2 directories..."

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$EC2_USERNAME@$EC2_HOST" \
            "mkdir -p \
              ~/enterprise-quantum-safe-platform/docker/nginx \
              ~/enterprise-quantum-safe-platform/monitoring/prometheus"

          echo "Uploading docker-compose.yml..."

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            docker-compose.yml \
            "$EC2_USERNAME@$EC2_HOST:~/enterprise-quantum-safe-platform/docker-compose.yml"

          echo "Uploading Nginx configuration..."

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            docker/nginx/default.conf \
            "$EC2_USERNAME@$EC2_HOST:~/enterprise-quantum-safe-platform/docker/nginx/default.conf"

          echo "Uploading Prometheus configuration..."

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            monitoring/prometheus/prometheus.yml \
            "$EC2_USERNAME@$EC2_HOST:~/enterprise-quantum-safe-platform/monitoring/prometheus/prometheus.yml"

          echo "Deployment configuration uploaded."

      # --------------------------------------------------------
      # Deploy Application
      # --------------------------------------------------------

      - name: Deploy Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}

          IMAGE_TAG: ${{ github.sha }}

          DOCKERHUB_BACKEND: naveedurehman/enterprise-quantum-safe-backend
          DOCKERHUB_FRONTEND: naveedurehman/enterprise-quantum-safe-frontend

          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_PRIVATE_KEY: ${{ secrets.TLS_PRIVATE_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Quantum-Safe Platform Deployment"
          echo "=========================================="

          echo "Image tag: $IMAGE_TAG"
          echo "Target: $EC2_USERNAME@$EC2_HOST"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USERNAME@$EC2_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' \
             DOCKERHUB_BACKEND='$DOCKERHUB_BACKEND' \
             DOCKERHUB_FRONTEND='$DOCKERHUB_FRONTEND' \
             DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' \
             DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' \
             POSTGRES_DB='$POSTGRES_DB' \
             POSTGRES_USER='$POSTGRES_USER' \
             POSTGRES_PASSWORD='$POSTGRES_PASSWORD' \
             TLS_CERT='$TLS_CERT' \
             TLS_PRIVATE_KEY='$TLS_PRIVATE_KEY' \
             bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          # ======================================================
          # DEPLOYMENT DIRECTORY
          # ======================================================

          DEPLOY_DIR="$HOME/enterprise-quantum-safe-platform"

          cd "$DEPLOY_DIR"

          echo "=========================================="
          echo "DEPLOYMENT DIRECTORY"
          echo "=========================================="

          pwd


          # ======================================================
          # REQUIRED FILES
          # ======================================================

          echo "=========================================="
          echo "VALIDATING REQUIRED FILES"
          echo "=========================================="

          REQUIRED_FILES=(
            "docker-compose.yml"
            "docker/nginx/default.conf"
            "monitoring/prometheus/prometheus.yml"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
          done

          echo "All required files found."


          # ======================================================
          # REQUIRED VARIABLES
          # ======================================================

          echo "=========================================="
          echo "VALIDATING DEPLOYMENT VARIABLES"
          echo "=========================================="

          REQUIRED_VARS=(
            IMAGE_TAG
            DOCKERHUB_BACKEND
            DOCKERHUB_FRONTEND
            DOCKERHUB_USERNAME
            DOCKERHUB_TOKEN
            POSTGRES_DB
            POSTGRES_USER
            POSTGRES_PASSWORD
            TLS_CERT
            TLS_PRIVATE_KEY
          )

          for var in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: Required variable is empty: $var"
              exit 1
            fi
          done

          echo "All deployment variables are present."


          # ======================================================
          # PREPARE TLS
          # ======================================================

          echo "=========================================="
          echo "PREPARING TLS"
          echo "=========================================="

          mkdir -p docker/nginx/ssl

          printf '%s\n' "$TLS_CERT" > docker/nginx/ssl/server.crt
          printf '%s\n' "$TLS_PRIVATE_KEY" > docker/nginx/ssl/server.key

          chmod 644 docker/nginx/ssl/server.crt
          chmod 600 docker/nginx/ssl/server.key

          echo "TLS files created."


          # ======================================================
          # VALIDATE TLS CERTIFICATE
          # ======================================================

          echo "=========================================="
          echo "VALIDATING TLS CERTIFICATE"
          echo "=========================================="

          if ! openssl x509 \
            -in docker/nginx/ssl/server.crt \
            -noout \
            -subject \
            -issuer \
            -dates; then

            echo "ERROR: TLS certificate is invalid."
            exit 1
          fi

          echo "TLS certificate is valid."


          # ======================================================
          # VALIDATE TLS PRIVATE KEY
          # ======================================================

          echo "=========================================="
          echo "VALIDATING TLS PRIVATE KEY"
          echo "=========================================="

          if ! openssl pkey \
            -in docker/nginx/ssl/server.key \
            -noout; then

            echo "ERROR: TLS private key is invalid."
            exit 1
          fi

          echo "TLS private key is valid."


          # ======================================================
          # VERIFY TLS CERTIFICATE / PRIVATE KEY MATCH
          # ======================================================

          echo "=========================================="
          echo "VERIFYING TLS CERTIFICATE / KEY MATCH"
          echo "=========================================="

          CERT_KEY_HASH=$(
            openssl x509 \
              -in docker/nginx/ssl/server.crt \
              -pubkey \
              -noout |
            openssl pkey \
              -pubin \
              -outform DER 2>/dev/null |
            sha256sum |
            awk '{print $1}'
          )

          PRIVATE_KEY_HASH=$(
            openssl pkey \
              -in docker/nginx/ssl/server.key \
              -pubout 2>/dev/null |
            openssl pkey \
              -pubin \
              -outform DER 2>/dev/null |
            sha256sum |
            awk '{print $1}'
          )

          if [ -z "$CERT_KEY_HASH" ] || [ -z "$PRIVATE_KEY_HASH" ]; then
            echo "ERROR: Could not calculate TLS public-key hashes."
            exit 1
          fi

          if [ "$CERT_KEY_HASH" != "$PRIVATE_KEY_HASH" ]; then
            echo "ERROR: TLS certificate and private key DO NOT MATCH."
            exit 1
          fi

          echo "TLS certificate and private key match."


          # ======================================================
          # DOCKER HUB LOGIN
          # ======================================================

          echo "=========================================="
          echo "DOCKER HUB LOGIN"
          echo "=========================================="

          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

          echo "Docker Hub login successful."

          # ======================================================
          # CREATE DEPLOYMENT .ENV
          # ======================================================

          echo "=========================================="
          echo "CREATING DEPLOYMENT .ENV"
          echo "=========================================="

          umask 077

          {
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
          } > .env

          chmod 600 .env

          echo ".env created."


          # ======================================================
          # VALIDATE DOCKER COMPOSE
          # ======================================================

          echo "=========================================="
          echo "VALIDATING DOCKER COMPOSE"
          echo "=========================================="

          docker compose config -q

          echo "Docker Compose configuration is valid."


          # ======================================================
          # PULL APPLICATION IMAGES
          # ======================================================

          echo "=========================================="
          echo "PULLING BACKEND IMAGE"
          echo "=========================================="

          docker pull "$DOCKERHUB_BACKEND:$IMAGE_TAG"


          echo "=========================================="
          echo "PULLING FRONTEND IMAGE"
          echo "=========================================="

          docker pull "$DOCKERHUB_FRONTEND:$IMAGE_TAG"


          # ======================================================
          # START POSTGRESQL
          # ======================================================

          echo "=========================================="
          echo "STARTING POSTGRESQL"
          echo "=========================================="

          docker compose up -d postgres


          # ======================================================
          # WAIT FOR POSTGRESQL
          # ======================================================

          echo "=========================================="
          echo "WAITING FOR POSTGRESQL"
          echo "=========================================="

          POSTGRES_READY=false

          for i in {1..30}; do

            if docker compose exec -T postgres \
              pg_isready \
              -U "$POSTGRES_USER" \
              -d "$POSTGRES_DB" \
              >/dev/null 2>&1; then

              echo "PostgreSQL is ready."
              POSTGRES_READY=true
              break

            fi

            echo "PostgreSQL not ready yet... attempt $i/30"
            sleep 2

          done

          if [ "$POSTGRES_READY" != "true" ]; then

            echo "ERROR: PostgreSQL failed to become ready."

            docker compose ps -a
            docker compose logs postgres --tail=150 || true

            exit 1

          fi


          # ======================================================
          # START BACKEND
          # ======================================================

          echo "=========================================="
          echo "STARTING BACKEND"
          echo "=========================================="

          docker compose up -d backend


          # ======================================================
          # WAIT FOR BACKEND HEALTHCHECK
          # ======================================================

          echo "=========================================="
          echo "WAITING FOR BACKEND HEALTH"
          echo "=========================================="

          BACKEND_READY=false

          for i in {1..30}; do

            BACKEND_CONTAINER=$(docker compose ps -q backend 2>/dev/null || true)

            if [ -n "$BACKEND_CONTAINER" ]; then

              BACKEND_HEALTH=$(
                docker inspect \
                  --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                  "$BACKEND_CONTAINER" \
                  2>/dev/null || true
              )

              echo "Backend health: $BACKEND_HEALTH"

              if [ "$BACKEND_HEALTH" = "healthy" ]; then
                BACKEND_READY=true
                break
              fi

            fi

            echo "Backend not healthy yet... attempt $i/30"

            sleep 2

          done


          if [ "$BACKEND_READY" != "true" ]; then

            echo "ERROR: Backend failed healthcheck."

            echo "=========================================="
            echo "BACKEND STATUS"
            echo "=========================================="

            docker compose ps -a

            echo "=========================================="
            echo "BACKEND LOGS"
            echo "=========================================="

            docker compose logs backend --tail=200 || true

            exit 1

          fi

          echo "Backend is healthy."


          # ======================================================
          # DATABASE MIGRATION
          # ======================================================

          echo "=========================================="
          echo "RUNNING DATABASE MIGRATION"
          echo "=========================================="

          docker compose exec -T backend \
            flask db upgrade

          echo "Database migration completed successfully."


          # ======================================================
          # START FRONTEND
          # ======================================================

          echo "=========================================="
          echo "STARTING FRONTEND"
          echo "=========================================="

          docker compose up -d frontend


          # ======================================================
          # START NGINX
          # ======================================================

          echo "=========================================="
          echo "STARTING NGINX"
          echo "=========================================="

          docker compose up -d nginx


          # ======================================================
          # START PROMETHEUS
          # ======================================================

          echo "=========================================="
          echo "STARTING PROMETHEUS"
          echo "=========================================="

          docker compose up -d prometheus


          # ======================================================
          # START GRAFANA
          # ======================================================

          echo "=========================================="
          echo "STARTING GRAFANA"
          echo "=========================================="

          docker compose up -d grafana


          # ======================================================
          # WAIT FOR SERVICES
          # ======================================================

          echo "=========================================="
          echo "WAITING FOR ALL SERVICES"
          echo "=========================================="

          sleep 10


          # ======================================================
          # SHOW ALL CONTAINERS
          # ======================================================

          echo "=========================================="
          echo "DOCKER COMPOSE STATUS"
          echo "=========================================="

          docker compose ps -a


          # ======================================================
          # VERIFY REQUIRED SERVICES
          # ======================================================

          echo "=========================================="
          echo "VERIFYING REQUIRED SERVICES"
          echo "=========================================="

          REQUIRED_SERVICES=(
            postgres
            backend
            frontend
            nginx
            prometheus
            grafana
          )

          for service in "${REQUIRED_SERVICES[@]}"; do

            CONTAINER_ID=$(
              docker compose ps -q "$service" 2>/dev/null || true
            )

            if [ -z "$CONTAINER_ID" ]; then

              echo "ERROR: No container exists for service: $service"

              docker compose ps -a

              exit 1

            fi

            STATUS=$(
              docker inspect \
                --format '{{.State.Status}}' \
                "$CONTAINER_ID"
            )

            if [ "$STATUS" != "running" ]; then

              echo "ERROR: Service is not running: $service"
              echo "Current status: $STATUS"

              echo "=========================================="
              echo "LOGS FOR $service"
              echo "=========================================="

              docker compose logs \
                --tail=150 \
                "$service" || true

              exit 1

            fi

            echo "$service: RUNNING"

          done


          # ======================================================
          # NGINX CONFIGURATION TEST
          # ======================================================

          echo "=========================================="
          echo "TESTING NGINX CONFIGURATION"
          echo "=========================================="

          if ! docker compose exec -T nginx nginx -t; then

            echo "ERROR: Nginx configuration test failed."

            docker compose logs nginx --tail=150 || true

            exit 1

          fi

          echo "Nginx configuration is valid."


          # ======================================================
          # DATABASE TEST
          # ======================================================

          echo "=========================================="
          echo "TESTING DATABASE"
          echo "=========================================="

          docker compose exec -T postgres \
            psql \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -c "SELECT current_user, current_database();"


          # ======================================================
          # ALEMBIC VERSION
          # ======================================================

          echo "=========================================="
          echo "CHECKING ALEMBIC MIGRATION VERSION"
          echo "=========================================="

          docker compose exec -T postgres \
            psql \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -c "SELECT version_num FROM alembic_version;" \
            || echo "WARNING: alembic_version table not available."


          # ======================================================
          # FINAL STATUS
          # ======================================================

          echo "=========================================="
          echo "FINAL DEPLOYMENT STATUS"
          echo "=========================================="

          docker compose ps -a


          # ======================================================
          # CLEAN UNUSED IMAGES
          # ======================================================

          echo "=========================================="
          echo "CLEANING UNUSED DOCKER IMAGES"
          echo "=========================================="

          docker image prune -f


          # ======================================================
          # SUCCESS
          # ======================================================

          echo "=========================================="
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=========================================="

          REMOTE_SCRIPT
