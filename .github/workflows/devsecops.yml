name: Enterprise Quantum-Safe DevSecOps

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: enterprise-quantum-safe-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PREFIX: ghcr.io/naveedurrehman959/enterprise-quantum-safe-platform

  DOCKERHUB_IMAGE_PREFIX: naveedurehman/enterprise-quantum-safe

  BACKEND_IMAGE: enterprise-quantum-safe-backend
  FRONTEND_IMAGE: enterprise-quantum-safe-frontend


jobs:

  # ============================================================
  # 1. DEPENDENCY REVIEW
  # ============================================================

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high


  # ============================================================
  # 2. SECRET SCANNING
  # ============================================================

  secret-scan:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 3. SAST - SEMGREP
  # ============================================================

  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            backend \
            frontend


  # ============================================================
  # 4. SAST - BANDIT
  # ============================================================

  bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r backend/app -ll


  # ============================================================
  # 5. BACKEND SCA
  # ============================================================

  backend-sca:
    name: Backend SCA - pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        run: |
          pip-audit -r requirements.txt


  # ============================================================
  # 6. FRONTEND SCA
  # ============================================================

  frontend-sca:
    name: Frontend SCA - npm audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=high


  # ============================================================
  # 7. BACKEND TESTS
  # ============================================================

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest -q tests


  # ============================================================
  # 8. FRONTEND LINT + BUILD
  # ============================================================

  frontend-validation:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: ESLint
        run: |
          npm run lint

      - name: Build React Application
        run: |
          npm run build


  # ============================================================
  # 9. SBOM
  # ============================================================

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-quantum-safe-sbom
          path: sbom-cyclonedx.json


  # ============================================================
  # 10. IaC / CONFIGURATION SCANNING
  # ============================================================

  iac-scan:
    name: IaC and Configuration Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trivy Configuration Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true


  # ============================================================
  # 11. DOCKER BUILD
  # ============================================================

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - semgrep
      - bandit
      - backend-sca
      - frontend-sca
      - backend-tests
      - frontend-validation
      - iac-scan
      - sbom

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ./frontend

      - name: Save Docker Images
        run: |
          docker save \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -o docker-images.tar

      - name: Upload Docker Images
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-docker-images
          path: docker-images.tar


  # ============================================================
  # 12. CONTAINER SECURITY SCANNING
  # ============================================================

  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-docker-images

      - name: Load Docker Images
        run: |
          docker load -i docker-images.tar

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: enterprise-quantum-safe-backend:${{ github.sha }}
          scanners: vuln
          pkg-types: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: enterprise-quantum-safe-frontend:${{ github.sha }}
          scanners: vuln
          pkg-types: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table


  # ============================================================
  # 13. PUBLISH IMAGES
  # ============================================================

  publish-images:
    name: Publish Images to GHCR and Docker Hub
    runs-on: ubuntu-latest

    needs:
      - container-scan

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-docker-images

      - name: Load Docker Images
        run: |
          docker load -i docker-images.tar

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Images
        run: |
          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ github.sha }}

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ github.sha }}

          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-backend:${{ github.sha }}

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-frontend:${{ github.sha }}

      - name: Push Backend to GHCR
        run: |
          docker push \
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Push Frontend to GHCR
        run: |
          docker push \
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ github.sha }}

      - name: Push Backend to Docker Hub
        run: |
          docker push \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Push Frontend to Docker Hub
        run: |
          docker push \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-frontend:${{ github.sha }}


  # ============================================================
  # 14. DEPLOY TO AWS EC2
  # ============================================================

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs:
      - publish-images

    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ========================================================
      # VALIDATE EC2 CONFIGURATION
      # ========================================================

      - name: Validate EC2 Configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$EC2_HOST" || {
            echo "ERROR: EC2_HOST is not configured."
            exit 1
          }

          test -n "$EC2_USERNAME" || {
            echo "ERROR: EC2_USERNAME is not configured."
            exit 1
          }

          test -n "$EC2_SSH_KEY" || {
            echo "ERROR: EC2_SSH_KEY is not configured."
            exit 1
          }

          echo "EC2 configuration detected."


      # ========================================================
      # CONFIGURE SSH
      # ========================================================

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          echo "Validating SSH private key..."

          ssh-keygen -y \
            -f "$HOME/.ssh/deploy_key" \
            > /dev/null

          echo "Checking EC2 port 22..."

          timeout 10 bash -c \
            "</dev/tcp/$EC2_HOST/22"

          echo "Scanning EC2 host key..."

          rm -f "$HOME/.ssh/known_hosts"

          ssh-keyscan \
            -T 15 \
            -p 22 \
            -H \
            "$EC2_HOST" \
            > "$HOME/.ssh/known_hosts"

          chmod 644 "$HOME/.ssh/known_hosts"

          echo "Testing SSH authentication..."

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USERNAME@$EC2_HOST" \
            "echo 'SSH authentication successful.'"


      # ========================================================
      # UPLOAD DEPLOYMENT CONFIGURATION
      # ========================================================

      - name: Upload Deployment Configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -euo pipefail

          echo "Checking deployment files..."

          test -f docker-compose.yml
          test -f docker/nginx/default.conf
          test -f monitoring/prometheus/prometheus.yml

          echo "Creating EC2 directories..."

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$EC2_USERNAME@$EC2_HOST" \
            "mkdir -p \
              ~/enterprise-quantum-safe-platform/docker/nginx \
              ~/enterprise-quantum-safe-platform/monitoring/prometheus"

          echo "Uploading docker-compose.yml..."

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            docker-compose.yml \
            "$EC2_USERNAME@$EC2_HOST:~/enterprise-quantum-safe-platform/docker-compose.yml"

          echo "Uploading Nginx configuration..."

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            docker/nginx/default.conf \
            "$EC2_USERNAME@$EC2_HOST:~/enterprise-quantum-safe-platform/docker/nginx/default.conf"

          echo "Uploading Prometheus configuration..."

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            monitoring/prometheus/prometheus.yml \
            "$EC2_USERNAME@$EC2_HOST:~/enterprise-quantum-safe-platform/monitoring/prometheus/prometheus.yml"

          echo "Deployment configuration uploaded."


      # ========================================================
      # DEPLOY APPLICATION
      # ========================================================

      - name: Deploy Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}

          IMAGE_TAG: ${{ github.sha }}

          DOCKERHUB_BACKEND: naveedurehman/enterprise-quantum-safe-backend
          DOCKERHUB_FRONTEND: naveedurehman/enterprise-quantum-safe-frontend

          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_PRIVATE_KEY: ${{ secrets.TLS_PRIVATE_KEY }}

        run: |
          set -euo pipefail

          echo "Preparing deployment secrets..."

          DOCKERHUB_TOKEN_B64="$(
            printf '%s' "$DOCKERHUB_TOKEN" |
            base64 -w 0
          )"

          POSTGRES_PASSWORD_B64="$(
            printf '%s' "$POSTGRES_PASSWORD" |
            base64 -w 0
          )"

          TLS_CERT_B64="$(
            printf '%s' "$TLS_CERT" |
            base64 -w 0
          )"

          TLS_PRIVATE_KEY_B64="$(
            printf '%s' "$TLS_PRIVATE_KEY" |
            base64 -w 0
          )"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USERNAME@$EC2_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' \
             DOCKERHUB_BACKEND='$DOCKERHUB_BACKEND' \
             DOCKERHUB_FRONTEND='$DOCKERHUB_FRONTEND' \
             DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' \
             DOCKERHUB_TOKEN_B64='$DOCKERHUB_TOKEN_B64' \
             POSTGRES_DB='$POSTGRES_DB' \
             POSTGRES_USER='$POSTGRES_USER' \
             POSTGRES_PASSWORD_B64='$POSTGRES_PASSWORD_B64' \
             TLS_CERT_B64='$TLS_CERT_B64' \
             TLS_PRIVATE_KEY_B64='$TLS_PRIVATE_KEY_B64' \
             bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          # ======================================================
          # DEPLOYMENT DIRECTORY
          # ======================================================

          DEPLOY_DIR="$HOME/enterprise-quantum-safe-platform"

          cd "$DEPLOY_DIR"

          echo "=========================================="
          echo "Deployment Directory"
          echo "=========================================="

          pwd


          # ======================================================
          # VALIDATE FILES
          # ======================================================

          REQUIRED_FILES=(
            "docker-compose.yml"
            "docker/nginx/default.conf"
            "monitoring/prometheus/prometheus.yml"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing file: $file"
              exit 1
            fi
          done

          echo "Required deployment files found."


          # ======================================================
          # DECODE SECRETS
          # ======================================================

          DOCKERHUB_TOKEN="$(
            printf '%s' "$DOCKERHUB_TOKEN_B64" |
            base64 -d
          )"

          POSTGRES_PASSWORD="$(
            printf '%s' "$POSTGRES_PASSWORD_B64" |
            base64 -d
          )"

          TLS_CERT="$(
            printf '%s' "$TLS_CERT_B64" |
            base64 -d
          )"

          TLS_PRIVATE_KEY="$(
            printf '%s' "$TLS_PRIVATE_KEY_B64" |
            base64 -d
          )"


          # ======================================================
          # PREPARE TLS
          # ======================================================

          echo "=========================================="
          echo "Preparing TLS"
          echo "=========================================="

          mkdir -p docker/nginx/ssl

          printf '%s' "$TLS_CERT" \
            > docker/nginx/ssl/server.crt

          printf '%s' "$TLS_PRIVATE_KEY" \
            > docker/nginx/ssl/server.key

          chmod 644 docker/nginx/ssl/server.crt
          chmod 600 docker/nginx/ssl/server.key


          # ======================================================
          # VALIDATE TLS CERTIFICATE
          # ======================================================

          echo "Validating TLS certificate..."

          openssl x509 \
            -in docker/nginx/ssl/server.crt \
            -noout \
            -subject \
            -issuer \
            -dates


          # ======================================================
          # VALIDATE TLS PRIVATE KEY
          # ======================================================

          echo "Validating TLS private key..."

          openssl pkey \
            -in docker/nginx/ssl/server.key \
            -noout


          # ======================================================
          # VERIFY CERTIFICATE / KEY MATCH
          # ======================================================

          echo "Checking TLS certificate/key match..."

          CERT_PUBLIC_KEY=$(
            openssl x509 \
              -in docker/nginx/ssl/server.crt \
              -pubkey \
              -noout |
            openssl pkey \
              -pubin \
              -outform DER |
            sha256sum |
            awk '{print $1}'
          )

          KEY_PUBLIC_KEY=$(
            openssl pkey \
              -in docker/nginx/ssl/server.key \
              -pubout |
            openssl pkey \
              -pubin \
              -outform DER |
            sha256sum |
            awk '{print $1}'
          )

          if [ -z "$CERT_PUBLIC_KEY" ] || [ -z "$KEY_PUBLIC_KEY" ]; then
            echo "ERROR: TLS fingerprints could not be calculated."
            exit 1
          fi

          if [ "$CERT_PUBLIC_KEY" != "$KEY_PUBLIC_KEY" ]; then
            echo "ERROR: TLS certificate and private key DO NOT MATCH."
            exit 1
          fi

          echo "TLS certificate and private key match."


          # ======================================================
          # DOCKER HUB LOGIN
          # ======================================================

          echo "Logging into Docker Hub..."

          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

          echo "Docker Hub login successful."


          # ======================================================
          # CREATE PRODUCTION ENVIRONMENT
          # ======================================================

          echo "Creating production .env..."

          umask 077

          cat > .env <<EOF
          IMAGE_TAG=$IMAGE_TAG
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          EOF

          chmod 600 .env

          # ------------------------------------------------------
          # Validate Docker Compose
          # ------------------------------------------------------

          echo "Validating Docker Compose..."

          docker compose config -q
          echo "Docker Compose configuration is valid."


          # ======================================================
          # PULL EXACT RELEASE IMAGES
          # ======================================================

          echo "Pulling backend image..."

          docker pull \
            "$DOCKERHUB_BACKEND:$IMAGE_TAG"

          echo "Pulling frontend image..."

          docker pull \
            "$DOCKERHUB_FRONTEND:$IMAGE_TAG"


          # ======================================================
          # VERIFY IMAGES
          # ======================================================

          docker image inspect \
            "$DOCKERHUB_BACKEND:$IMAGE_TAG" \
            >/dev/null

          docker image inspect \
            "$DOCKERHUB_FRONTEND:$IMAGE_TAG" \
            >/dev/null

          echo "Application images verified."


          # ======================================================
          # START POSTGRESQL
          # ======================================================

          echo "Starting PostgreSQL..."

          docker compose up -d postgres


          # ======================================================
          # WAIT FOR POSTGRESQL
          # ======================================================

          POSTGRES_READY=false

          for i in {1..30}; do

            if docker compose exec -T postgres \
              pg_isready \
              -U "$POSTGRES_USER" \
              -d "$POSTGRES_DB" \
              >/dev/null 2>&1; then

              POSTGRES_READY=true

              echo "PostgreSQL is ready."

              break
            fi

            echo "PostgreSQL not ready... attempt $i/30"

            sleep 2

          done

          if [ "$POSTGRES_READY" != "true" ]; then

            echo "ERROR: PostgreSQL failed to become ready."

            docker compose ps
            docker compose logs postgres --tail=100 || true

            exit 1

          fi


          # ======================================================
          # DATABASE CONNECTION TEST
          # ======================================================

          echo "Testing PostgreSQL connection..."

          docker compose exec -T postgres \
            psql \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -c "SELECT current_user, current_database();"


          # ======================================================
          # DATABASE MIGRATION
          # ======================================================

          echo "=========================================="
          echo "Running Database Migration"
          echo "=========================================="

          docker compose run \
            --rm \
            --no-deps \
            backend \
            flask db upgrade

          echo "Database migration completed successfully."


          # ======================================================
          # REMOVE OLD APPLICATION CONTAINERS
          #
          # PostgreSQL is intentionally preserved.
          # ======================================================

          echo "Removing old application containers..."

          docker rm -f \
            quantum-safe-backend \
            quantum-safe-frontend \
            quantum-safe-nginx \
            quantum-safe-prometheus \
            quantum-safe-grafana \
            2>/dev/null || true


          # ======================================================
          # START COMPLETE APPLICATION STACK
          # ======================================================

          echo "Starting production stack..."

          docker compose up -d \
            --force-recreate \
            --remove-orphans

          echo "Production stack started."


          # ======================================================
          # WAIT FOR BACKEND
          # ======================================================

          echo "Waiting for backend..."

          BACKEND_READY=false

          for i in {1..30}; do

            if docker compose exec -T backend \
              python -c \
              "import socket; s=socket.create_connection(('127.0.0.1',5001),3); s.close()" \
              >/dev/null 2>&1; then

              BACKEND_READY=true

              echo "Backend is ready."

              break
            fi

            echo "Backend not ready... attempt $i/30"

            sleep 2

          done

          if [ "$BACKEND_READY" != "true" ]; then

            echo "ERROR: Backend failed to start."

            docker compose ps
            docker compose logs backend --tail=150 || true

            exit 1

          fi


          # ======================================================
          # WAIT FOR NGINX
          # ======================================================

          echo "Waiting for Nginx..."

          NGINX_READY=false

          for i in {1..30}; do

            if docker compose exec -T nginx \
              nginx -t \
              >/dev/null 2>&1; then

              NGINX_READY=true

              echo "Nginx configuration is valid."

              break
            fi

            echo "Nginx not ready... attempt $i/30"

            sleep 2

          done

          if [ "$NGINX_READY" != "true" ]; then

            echo "ERROR: Nginx failed."

            docker compose ps
            docker compose logs nginx --tail=150 || true

            exit 1

          fi


          # ======================================================
          # FINAL NGINX TEST
          # ======================================================

          echo "Running final Nginx configuration test..."

          docker compose exec -T nginx nginx -t


          # ======================================================
          # VERIFY REQUIRED SERVICES
          # ======================================================

          echo "=========================================="
          echo "Verifying Required Services"
          echo "=========================================="

          REQUIRED_SERVICES=(
            postgres
            backend
            frontend
            nginx
            prometheus
            grafana
          )

          FAILED=0

          for service in "${REQUIRED_SERVICES[@]}"; do

            CONTAINER_ID=$(
              docker compose ps -q "$service" 2>/dev/null || true
            )

            if [ -z "$CONTAINER_ID" ]; then

              echo "ERROR: $service has no container."

              FAILED=1

              continue

            fi

            STATUS=$(
              docker inspect \
                --format '{{.State.Status}}' \
                "$CONTAINER_ID"
            )

            if [ "$STATUS" != "running" ]; then

              echo "ERROR: $service is not running."
              echo "Status: $STATUS"

              docker compose logs \
                --tail=100 \
                "$service" || true

              FAILED=1

            else

              echo "$service: RUNNING"

            fi

          done


          if [ "$FAILED" -ne 0 ]; then

            echo "=========================================="
            echo "DEPLOYMENT FAILED"
            echo "=========================================="

            docker compose ps

            exit 1

          fi


          # ======================================================
          # MIGRATION VERIFICATION
          # ======================================================

          echo "Checking Alembic migration..."

          docker compose exec -T postgres \
            psql \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -c "SELECT version_num FROM alembic_version;"


          # ======================================================
          # BACKEND HEALTH CHECK
          # ======================================================

          echo "Running backend health check..."

          if curl \
            --silent \
            --fail \
            --max-time 10 \
            http://127.0.0.1:5001/health \
            >/dev/null 2>&1; then

            echo "Backend /health: OK"

          else

            echo "WARNING: /health endpoint unavailable."

            docker compose logs backend --tail=100 || true

          fi


          # ======================================================
          # CLEAN OLD IMAGES
          # ======================================================

          echo "Cleaning unused Docker images..."

          docker image prune -f


          # ======================================================
          # FINAL STATUS
          # ======================================================

          echo "=========================================="
          echo "FINAL CONTAINER STATUS"
          echo "=========================================="

          docker compose ps


          echo "=========================================="
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=========================================="

          REMOTE_SCRIPT
