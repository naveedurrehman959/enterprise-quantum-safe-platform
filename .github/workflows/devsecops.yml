
name: Enterprise Quantum-Safe DevSecOps

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PREFIX: ghcr.io/naveedurrehman959/enterprise-quantum-safe-platform

  DOCKERHUB_IMAGE_PREFIX: naveedurehman/enterprise-quantum-safe

  BACKEND_IMAGE: enterprise-quantum-safe-backend
  FRONTEND_IMAGE: enterprise-quantum-safe-frontend


jobs:

  # ============================================================
  # 1. DEPENDENCY REVIEW
  # ============================================================

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high


  # ============================================================
  # 2. SECRET SCANNING
  # ============================================================

  secret-scan:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 3. SAST - SEMGREP
  # ============================================================

  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            backend \
            frontend


  # ============================================================
  # 4. SAST - BANDIT
  # ============================================================

  bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r backend/app -ll


  # ============================================================
  # 5. BACKEND SCA
  # ============================================================

  backend-sca:
    name: Backend SCA - pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        run: |
          pip-audit -r requirements.txt


  # ============================================================
  # 6. FRONTEND SCA
  # ============================================================

  frontend-sca:
    name: Frontend SCA - npm audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=high


  # ============================================================
  # 7. BACKEND TESTS
  # ============================================================

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest -q tests


  # ============================================================
  # 8. FRONTEND LINT + BUILD
  # ============================================================

  frontend-validation:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: ESLint
        run: |
          npm run lint

      - name: Build React Application
        run: |
          npm run build


  # ============================================================
  # 9. SBOM
  # ============================================================

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-quantum-safe-sbom
          path: sbom-cyclonedx.json


  # ============================================================
  # 10. IaC / CONFIGURATION SCANNING
  # ============================================================

  iac-scan:
    name: IaC and Configuration Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trivy Configuration Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true


  # ============================================================
  # 11. DOCKER BUILD
  # ============================================================

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - semgrep
      - bandit
      - backend-sca
      - frontend-sca
      - backend-tests
      - frontend-validation
      - iac-scan
      - sbom

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ./frontend

      - name: Save Docker Images
        run: |
          docker save \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -o docker-images.tar

      - name: Upload Docker Images
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-docker-images
          path: docker-images.tar


  # ============================================================
  # 12. CONTAINER SECURITY SCANNING
  #
  # TRIVY POLICY: WARNING ONLY
  # ============================================================

  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-docker-images

      - name: Load Docker Images
        run: |
          docker load -i docker-images.tar

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: enterprise-quantum-safe-backend:${{ github.sha }}
          scanners: vuln
          pkg-types: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: enterprise-quantum-safe-frontend:${{ github.sha }}
          scanners: vuln
          pkg-types: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table


  # ============================================================
  # 13. PUBLISH IMAGES
  # ============================================================

  publish-images:
    name: Publish Images to GHCR and Docker Hub
    runs-on: ubuntu-latest

    needs:
      - container-scan

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-docker-images

      - name: Load Docker Images
        run: |
          docker load -i docker-images.tar


      # --------------------------------------------------------
      # GHCR LOGIN
      # --------------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # DOCKER HUB LOGIN
      # --------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------------
      # VERIFY DOCKER HUB LOGIN
      # --------------------------------------------------------

      - name: Verify Docker Hub Login
        run: |
          echo "Docker Hub authentication completed."
          echo "Docker Hub username: ${{ secrets.DOCKERHUB_USERNAME }}"


      # --------------------------------------------------------
      # TAG IMAGES
      # --------------------------------------------------------

      - name: Tag Images
        run: |
          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ github.sha }}

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ github.sha }}

          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-backend:${{ github.sha }}

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-frontend:${{ github.sha }}


      # --------------------------------------------------------
      # PUSH BACKEND TO GHCR
      # --------------------------------------------------------

      - name: Push Backend to GHCR
        run: |
          docker push \
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ github.sha }}


      # --------------------------------------------------------
      # PUSH FRONTEND TO GHCR
      # --------------------------------------------------------

      - name: Push Frontend to GHCR
        run: |
          docker push \
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ github.sha }}


      # --------------------------------------------------------
      # PUSH BACKEND TO DOCKER HUB
      # --------------------------------------------------------

      - name: Push Backend to Docker Hub
        run: |
          docker push \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-backend:${{ github.sha }}


      # --------------------------------------------------------
      # PUSH FRONTEND TO DOCKER HUB
      # --------------------------------------------------------

      - name: Push Frontend to Docker Hub
        run: |
          docker push \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-frontend:${{ github.sha }}


  # ============================================================
  # 14. DEPLOY TO AWS EC2
  # ============================================================

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs:
      - publish-images

    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    steps:

      # --------------------------------------------------------
      # Validate EC2 secrets
      # --------------------------------------------------------

      - name: Validate EC2 Configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is not configured."
            exit 1
          fi

          if [ -z "$EC2_USERNAME" ]; then
            echo "ERROR: EC2_USERNAME secret is not configured."
            exit 1
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY secret is not configured."
            exit 1
          fi

          echo "EC2 deployment configuration detected."


      # --------------------------------------------------------
      # Configure SSH
      # --------------------------------------------------------

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          echo "Configuring SSH..."

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          echo "Checking SSH private key..."

          if ! ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null 2>&1; then
            echo "ERROR: EC2_SSH_KEY is not a valid SSH private key."
            exit 1
          fi

          echo "SSH private key format is valid."

          echo "Scanning EC2 host..."

          ssh-keyscan \
            -T 15 \
            -H "$EC2_HOST" \
            > "$HOME/.ssh/known_hosts"

          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "ERROR: ssh-keyscan returned no host key."
            echo "Check EC2_HOST and that port 22 is reachable."
            exit 1
          fi

          chmod 644 "$HOME/.ssh/known_hosts"

          echo "SSH configuration completed successfully."


      # --------------------------------------------------------
      # Deploy Application
      # Docker Hub -> EC2 -> Docker Compose
      # --------------------------------------------------------

      - name: Deploy Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}

          IMAGE_TAG: ${{ github.sha }}

          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

        run: |
          set -e

          echo "=========================================="
          echo "Quantum-Safe Platform Deployment"
          echo "=========================================="

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            "$EC2_USERNAME@$EC2_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' \
             DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' \
             DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' \
             POSTGRES_DB='$POSTGRES_DB' \
             POSTGRES_USER='$POSTGRES_USER' \
             POSTGRES_PASSWORD='$POSTGRES_PASSWORD' \
             bash -s" <<'REMOTE_SCRIPT'

          set -e

          echo "=========================================="
          echo "Checking Docker"
          echo "=========================================="

          docker --version
          docker compose version


          echo "=========================================="
          echo "Preparing deployment directory"
          echo "=========================================="

          mkdir -p ~/enterprise-quantum-safe-platform
          cd ~/enterprise-quantum-safe-platform


          echo "=========================================="
          echo "Checking Compose files"
          echo "=========================================="

          if [ ! -f docker-compose.yml ]; then
            echo "ERROR: docker-compose.yml not found on EC2."
            echo "The deployment directory must contain the production Compose configuration."
            exit 1
          fi

          if [ ! -f docker/nginx/default.conf ]; then
            echo "ERROR: NGINX configuration not found."
            exit 1
          fi

          if [ ! -f monitoring/prometheus/prometheus.yml ]; then
            echo "ERROR: Prometheus configuration not found."
            exit 1
          fi


          echo "Compose files detected."


          echo "=========================================="
          echo "Logging into Docker Hub"
          echo "=========================================="

          echo "$DOCKERHUB_TOKEN" | docker login \
            -u "$DOCKERHUB_USERNAME" \
            --password-stdin


          echo "=========================================="
          echo "Creating production environment"
          echo "=========================================="

          cat > .env <<EOF
          IMAGE_TAG=$IMAGE_TAG
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          EOF

          chmod 600 .env


          echo "=========================================="
          echo "Validating Compose configuration"
          echo "=========================================="

          docker compose config -q

          echo "Compose configuration is valid."


          echo "=========================================="
          echo "Pulling Docker Hub Images"
          echo "=========================================="

          docker compose pull


          echo "=========================================="
          echo "Starting Production Stack"
          echo "=========================================="

          docker compose up -d


          echo "=========================================="
          echo "Waiting for Services"
          echo "=========================================="

          sleep 20


          echo "=========================================="
          echo "Container Status"
          echo "=========================================="

          docker compose ps


          echo "=========================================="
          echo "Checking PostgreSQL"
          echo "=========================================="

          POSTGRES_STATUS=$(docker inspect \
            --format='{{.State.Status}}' \
            quantum-safe-postgres)

          echo "PostgreSQL: $POSTGRES_STATUS"

          if [ "$POSTGRES_STATUS" != "running" ]; then
            echo "ERROR: PostgreSQL is not running."

            docker compose logs --tail 100 postgres

            exit 1
          fi


          echo "PostgreSQL container is running."


          echo "=========================================="
          echo "Testing PostgreSQL Readiness"
          echo "=========================================="

          docker exec quantum-safe-postgres \
            pg_isready \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB"


          echo "PostgreSQL is accepting connections."


          echo "=========================================="
          echo "Checking Backend"
          echo "=========================================="

          BACKEND_STATUS=$(docker inspect \
            --format='{{.State.Status}}' \
            quantum-safe-backend)

          echo "Backend: $BACKEND_STATUS"

          if [ "$BACKEND_STATUS" != "running" ]; then
            echo "ERROR: Backend is not running."

            docker compose logs --tail 100 backend

            exit 1
          fi


          echo "Backend container is running."


          echo "=========================================="
          echo "Checking Backend Environment"
          echo "=========================================="

          docker exec quantum-safe-backend \
            sh -c 'test -n "$DATABASE_URL"'

          echo "DATABASE_URL is configured."


          echo "=========================================="
          echo "Testing Backend Health"
          echo "=========================================="

          curl -f http://localhost:5001/health

          echo
          echo "Backend health check PASSED."


          echo "=========================================="
          echo "Checking Frontend"
          echo "=========================================="

          FRONTEND_STATUS=$(docker inspect \
            --format='{{.State.Status}}' \
            quantum-safe-frontend)

          echo "Frontend: $FRONTEND_STATUS"

          if [ "$FRONTEND_STATUS" != "running" ]; then
            echo "ERROR: Frontend is not running."

            docker compose logs --tail 100 frontend

            exit 1
          fi


          echo "Frontend container is running."


          echo "=========================================="
          echo "Testing Frontend"
          echo "=========================================="

          curl -f -I http://localhost

          echo "Frontend health check PASSED."


          echo "=========================================="
          echo "Testing Frontend -> Backend DNS"
          echo "=========================================="

          docker exec quantum-safe-frontend \
            getent hosts quantum-safe-backend


          echo "Frontend can resolve backend."


          echo "=========================================="
          echo "Testing Frontend -> Backend Connectivity"
          echo "=========================================="

          docker exec quantum-safe-frontend \
            wget -qO- http://quantum-safe-backend:5001/health


          echo
          echo "Frontend -> Backend connectivity PASSED."


          echo "=========================================="
          echo "Checking NGINX"
          echo "=========================================="

          if docker inspect quantum-safe-nginx \
            --format='{{.State.Status}}' | grep -q running; then

            echo "NGINX is running."

          else

            echo "ERROR: NGINX is not running."

            docker compose logs --tail 100 nginx

            exit 1

          fi


          echo "=========================================="
          echo "Checking Prometheus"
          echo "=========================================="

          if docker inspect quantum-safe-prometheus \
            --format='{{.State.Status}}' | grep -q running; then

            echo "Prometheus is running."

          else

            echo "WARNING: Prometheus is not running."

            docker compose logs --tail 50 prometheus

          fi


          echo "=========================================="
          echo "Checking Grafana"
          echo "=========================================="

          if docker inspect quantum-safe-grafana \
            --format='{{.State.Status}}' | grep -q running; then

            echo "Grafana is running."

          else

            echo "WARNING: Grafana is not running."

            docker compose logs --tail 50 grafana

          fi


          echo "=========================================="
          echo "Checking PostgreSQL Volume"
          echo "=========================================="

          docker volume ls | grep postgres_data || true


          echo "=========================================="
          echo "FINAL DEPLOYMENT STATUS"
          echo "=========================================="

          docker compose ps


          echo "=========================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          REMOTE_SCRIPT
