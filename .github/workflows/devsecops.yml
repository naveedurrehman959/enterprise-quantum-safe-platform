name: Enterprise Quantum-Safe DevSecOps

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PREFIX: ghcr.io/naveedurrehman959/enterprise-quantum-safe-platform

  DOCKERHUB_IMAGE_PREFIX: naveedurrehman/enterprise-quantum-safe

  BACKEND_IMAGE: enterprise-quantum-safe-backend
  FRONTEND_IMAGE: enterprise-quantum-safe-frontend


# ============================================================
# JOBS
# ============================================================

jobs:

  # ============================================================
  # 1. DEPENDENCY REVIEW
  # ============================================================

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high


  # ============================================================
  # 2. SECRET SCANNING
  # ============================================================

  secret-scan:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 3. SAST - SEMGREP
  # ============================================================

  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            backend \
            frontend


  # ============================================================
  # 4. SAST - BANDIT
  # ============================================================

  bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r backend/app -ll


  # ============================================================
  # 5. BACKEND SCA
  # ============================================================

  backend-sca:
    name: Backend SCA - pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        run: |
          pip-audit -r requirements.txt


  # ============================================================
  # 6. FRONTEND SCA
  # ============================================================

  frontend-sca:
    name: Frontend SCA - npm audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=high


  # ============================================================
  # 7. BACKEND TESTS
  # ============================================================

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest -q tests


  # ============================================================
  # 8. FRONTEND LINT + BUILD
  # ============================================================

  frontend-validation:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: ESLint
        run: |
          npm run lint

      - name: Build React Application
        run: |
          npm run build


  # ============================================================
  # 9. SBOM
  # ============================================================

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-quantum-safe-sbom
          path: sbom-cyclonedx.json


  # ============================================================
  # 10. IaC / CONFIGURATION SCANNING
  #
  # TRIVY POLICY:
  # WARNING ONLY
  # NEVER BLOCK PIPELINE
  # ============================================================

  iac-scan:
    name: IaC and Configuration Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trivy Configuration Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true


  # ============================================================
  # 11. DOCKER BUILD
  # ============================================================

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - semgrep
      - bandit
      - backend-sca
      - frontend-sca
      - backend-tests
      - frontend-validation
      - iac-scan
      - sbom

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ./frontend

      - name: Save Docker Images
        run: |
          docker save \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -o docker-images.tar

      - name: Upload Docker Images
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-docker-images
          path: docker-images.tar


  # ============================================================
  # 12. CONTAINER SECURITY SCANNING
  #
  # TRIVY POLICY:
  # WARNING ONLY
  # NEVER BLOCK PIPELINE
  # ============================================================

  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-docker-images

      - name: Load Docker Images
        run: |
          docker load -i docker-images.tar

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: enterprise-quantum-safe-backend:${{ github.sha }}
          scanners: vuln
          pkg-types: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: enterprise-quantum-safe-frontend:${{ github.sha }}
          scanners: vuln
          pkg-types: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table


  # ============================================================
  # 13. PUBLISH IMAGES
  # ============================================================

  publish-images:
    name: Publish Images to GHCR and Docker Hub
    runs-on: ubuntu-latest

    needs:
      - container-scan

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-docker-images

      - name: Load Docker Images
        run: |
          docker load -i docker-images.tar

      # --------------------------------------------------------
      # GHCR Login
      # --------------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------------
      # Docker Hub Login
      # --------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # Tag Images
      # --------------------------------------------------------

      - name: Tag Images
        run: |
          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ github.sha }}

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ github.sha }}

          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-backend:${{ github.sha }}

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-frontend:${{ github.sha }}

      # --------------------------------------------------------
      # Push GHCR
      # --------------------------------------------------------

      - name: Push Backend to GHCR
        run: |
          docker push \
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Push Frontend to GHCR
        run: |
          docker push \
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ github.sha }}

      # --------------------------------------------------------
      # Push Docker Hub
      # --------------------------------------------------------

      - name: Push Backend to Docker Hub
        run: |
          docker push \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Push Frontend to Docker Hub
        run: |
          docker push \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-frontend:${{ github.sha }}


  # ============================================================
  # 14. DEPLOY TO AWS EC2
  #
  # EC2_HOST SECRET IS USED DIRECTLY
  # NO TERRAFORM REQUIRED IN GITHUB ACTIONS
  # ============================================================

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs:
      - publish-images

    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    steps:

      # --------------------------------------------------------
      # Validate Deployment Secrets
      # --------------------------------------------------------

      - name: Validate EC2 Deployment Secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          echo "Validating deployment configuration..."

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is not configured."
            exit 1
          fi

          if [ -z "$EC2_SSH_PRIVATE_KEY" ]; then
            echo "ERROR: EC2_SSH_PRIVATE_KEY secret is not configured."
            exit 1
          fi

          echo "EC2_HOST is configured."
          echo "SSH private key is configured."


      # --------------------------------------------------------
      # Configure SSH
      #
      # Uses RUNNER_TEMP instead of ~/.ssh
      # This avoids the mkdir ~/.ssh failure.
      # --------------------------------------------------------

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -e

          echo "Preparing temporary SSH directory..."

          SSH_DIR="${RUNNER_TEMP}/enterprise-ssh"

          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          echo "Writing deployment SSH key..."

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$SSH_DIR/deploy_key"

          chmod 600 "$SSH_DIR/deploy_key"

          echo "Scanning EC2 SSH host key..."

          ssh-keyscan -H "$EC2_HOST" > "$SSH_DIR/known_hosts" 2>/dev/null

          if [ ! -s "$SSH_DIR/known_hosts" ]; then
            echo "ERROR: Could not retrieve SSH host key from EC2."
            exit 1
          fi

          echo "SSH configuration completed."

          echo "SSH_DIR=$SSH_DIR" >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # Test SSH Connection
      # --------------------------------------------------------

      - name: Test EC2 SSH Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -e

          echo "Testing SSH connection to EC2..."

          ssh \
            -i "$SSH_DIR/deploy_key" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            ubuntu@"$EC2_HOST" \
            "echo 'EC2 SSH connection successful.'"


      # --------------------------------------------------------
      # Deploy Containers
      # --------------------------------------------------------

      - name: Deploy Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          IMAGE_TAG: ${{ github.sha }}

          GHCR_BACKEND: ghcr.io/naveedurrehman959/enterprise-quantum-safe-platform-backend
          GHCR_FRONTEND: ghcr.io/naveedurrehman959/enterprise-quantum-safe-platform-frontend

          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -e

          echo "=========================================="
          echo "Quantum-Safe Platform Deployment"
          echo "=========================================="

          ssh \
            -i "$SSH_DIR/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            ubuntu@"$EC2_HOST" \
            "GHCR_BACKEND='$GHCR_BACKEND' \
             GHCR_FRONTEND='$GHCR_FRONTEND' \
             IMAGE_TAG='$IMAGE_TAG' \
             GHCR_USERNAME='$GHCR_USERNAME' \
             GHCR_TOKEN='$GHCR_TOKEN' \
             bash -s" <<'REMOTE_SCRIPT'

          set -e

          echo "=========================================="
          echo "Logging into GitHub Container Registry"
          echo "=========================================="

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GHCR_USERNAME" \
            --password-stdin


          echo "=========================================="
          echo "Pulling Backend Image"
          echo "=========================================="

          docker pull \
            "$GHCR_BACKEND:$IMAGE_TAG"


          echo "=========================================="
          echo "Pulling Frontend Image"
          echo "=========================================="

          docker pull \
            "$GHCR_FRONTEND:$IMAGE_TAG"


          echo "=========================================="
          echo "Stopping Previous Containers"
          echo "=========================================="

          docker rm -f quantum-safe-backend 2>/dev/null || true
          docker rm -f quantum-safe-frontend 2>/dev/null || true


          echo "=========================================="
          echo "Starting Backend"
          echo "=========================================="

          docker run -d \
            --name quantum-safe-backend \
            --restart unless-stopped \
            -p 5001:5001 \
            "$GHCR_BACKEND:$IMAGE_TAG"


          echo "=========================================="
          echo "Starting Frontend"
          echo "=========================================="

          docker run -d \
            --name quantum-safe-frontend \
            --restart unless-stopped \
            -p 80:80 \
            "$GHCR_FRONTEND:$IMAGE_TAG"


          echo "=========================================="
          echo "Containers Started"
          echo "=========================================="

          docker ps \
            --filter "name=quantum-safe-backend" \
            --filter "name=quantum-safe-frontend"


          echo "=========================================="
          echo "Running Docker Health Check"
          echo "=========================================="

          sleep 15


          BACKEND_STATUS=$(docker inspect \
            --format='{{.State.Status}}' \
            quantum-safe-backend)

          FRONTEND_STATUS=$(docker inspect \
            --format='{{.State.Status}}' \
            quantum-safe-frontend)


          echo "Backend status:  $BACKEND_STATUS"
          echo "Frontend status: $FRONTEND_STATUS"


          if [ "$BACKEND_STATUS" != "running" ]; then
            echo "ERROR: Backend container is not running."

            docker logs --tail 100 quantum-safe-backend

            exit 1
          fi


          if [ "$FRONTEND_STATUS" != "running" ]; then
            echo "ERROR: Frontend container is not running."

            docker logs --tail 100 quantum-safe-frontend

            exit 1
          fi


          echo "=========================================="
          echo "Deployment Health Check PASSED"
          echo "=========================================="

          docker ps \
            --filter "name=quantum-safe-backend" \
            --filter "name=quantum-safe-frontend"

          REMOTE_SCRIPT


      # --------------------------------------------------------
      # Deployment Summary
      # --------------------------------------------------------

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          echo "Commit:"
          echo "${{ github.sha }}"

          echo "Environment:"
          echo "AWS EC2"

          echo "Deployment method:"
          echo "SSH + Docker"

          echo "Backend image:"
          echo "${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ github.sha }}"

          echo "Frontend image:"
          echo "${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ github.sha }}"

          echo "Health check:"
          echo "Docker container status = RUNNING"

          echo "=========================================="


  # ============================================================
  # 15. POST-DEPLOYMENT HEALTH CHECK
  #
  # Uses EC2_HOST directly.
  # NO TERRAFORM REQUIRED.
  # ============================================================

  deployment-health:
    name: Post Deployment Health Check
    runs-on: ubuntu-latest

    needs:
      - deploy

    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    steps:

      # --------------------------------------------------------
      # Validate Secrets
      # --------------------------------------------------------

      - name: Validate EC2 Deployment Secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -e

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is not configured."
            exit 1
          fi

          if [ -z "$EC2_SSH_PRIVATE_KEY" ]; then
            echo "ERROR: EC2_SSH_PRIVATE_KEY secret is not configured."
            exit 1
          fi

          echo "Deployment secrets are configured."


      # --------------------------------------------------------
      # Configure SSH
      # --------------------------------------------------------

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -e

          SSH_DIR="${RUNNER_TEMP}/enterprise-health-ssh"

          mkdir -p "$SSH_DIR"
          chmod 700 "$SSH_DIR"

          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > "$SSH_DIR/deploy_key"

          chmod 600 "$SSH_DIR/deploy_key"

          ssh-keyscan -H "$EC2_HOST" > "$SSH_DIR/known_hosts" 2>/dev/null

          if [ ! -s "$SSH_DIR/known_hosts" ]; then
            echo "ERROR: Could not retrieve EC2 SSH host key."
            exit 1
          fi

          echo "SSH_DIR=$SSH_DIR" >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # Verify Containers
      # --------------------------------------------------------

      - name: Verify Containers
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -e

          echo "=========================================="
          echo "Remote Container Health Check"
          echo "=========================================="

          ssh \
            -i "$SSH_DIR/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            ubuntu@"$EC2_HOST" \
            bash -s <<'REMOTE_SCRIPT'

          set -e

          BACKEND_STATUS=$(docker inspect \
            --format='{{.State.Status}}' \
            quantum-safe-backend)

          FRONTEND_STATUS=$(docker inspect \
            --format='{{.State.Status}}' \
            quantum-safe-frontend)


          echo "Backend:  $BACKEND_STATUS"
          echo "Frontend: $FRONTEND_STATUS"


          if [ "$BACKEND_STATUS" != "running" ]; then
            echo "Backend health check FAILED"

            docker logs --tail 100 quantum-safe-backend

            exit 1
          fi


          if [ "$FRONTEND_STATUS" != "running" ]; then
            echo "Frontend health check FAILED"

            docker logs --tail 100 quantum-safe-frontend

            exit 1
          fi


          echo ""
          echo "Docker containers are healthy."
          echo "Deployment verified successfully."


          echo ""
          echo "=========================================="
          echo "FINAL DEPLOYMENT STATUS"
          echo "=========================================="

          docker ps \
            --filter "name=quantum-safe-backend" \
            --filter "name=quantum-safe-frontend"

          REMOTE_SCRIPT
