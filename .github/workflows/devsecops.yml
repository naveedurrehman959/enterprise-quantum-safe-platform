
name: Enterprise Quantum-Safe DevSecOps

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. DEPENDENCY REVIEW
  # ============================================================

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high


  # ============================================================
  # 2. SECRET SCANNING
  # ============================================================

  secret-scan:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 3. SAST - SEMGREP
  # ============================================================
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            backend \
            frontend


  # ============================================================
  # 4. SAST - BANDIT
  # ============================================================

  bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r backend/app -ll


  # ============================================================
  # 5. BACKEND SCA
  # ============================================================

  backend-sca:
    name: Backend SCA - pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        run: |
          pip-audit -r requirements.txt


  # ============================================================
  # 6. FRONTEND SCA
  # ============================================================

  frontend-sca:
    name: Frontend SCA - npm audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=high


  # ============================================================
  # 7. BACKEND TESTS
  # ============================================================

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest -q tests


  # ============================================================
  # 8. FRONTEND LINT + BUILD
  # ============================================================

  frontend-validation:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: ESLint
        run: |
          npm run lint

      - name: Build React Application
        run: |
          npm run build


  # ============================================================
  # 9. SBOM
  # ============================================================

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-quantum-safe-sbom
          path: sbom-cyclonedx.json

     # ============================================================
  # 10. DOCKER BUILD
  # ============================================================

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - semgrep
      - bandit
      - backend-sca
      - frontend-sca
      - backend-tests
      - frontend-validation
      - sbom
      - iac-scan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t enterprise-quantum-safe-backend:${{ github.sha }} \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t enterprise-quantum-safe-frontend:${{ github.sha }} \
            ./frontend

      - name: Save Docker Images
        run: |
          docker save \
            enterprise-quantum-safe-backend:${{ github.sha }} \
            enterprise-quantum-safe-frontend:${{ github.sha }} \
            -o docker-images.tar

      - name: Upload Docker Images
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-docker-images
          path: docker-images.tar


  # ============================================================
  # 11. CONTAINER SECURITY SCANNING
  # ============================================================

  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-docker-images

      - name: Load Docker Images
        run: |
          docker load -i docker-images.tar

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-quantum-safe-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: enterprise-quantum-safe-frontend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true


  # ============================================================
  # 12. PUBLISH APPROVED IMAGES TO GHCR
  # ============================================================

  publish-images:
    name: Publish Images to GHCR
    runs-on: ubuntu-latest

    needs:
      - container-scan

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_PREFIX: ghcr.io/naveedurrehman959/enterprise-quantum-safe-platform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-docker-images

      - name: Load Docker Images
        run: |
          docker load -i docker-images.tar

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Backend Image
        run: |
          docker tag \
            enterprise-quantum-safe-backend:${{ github.sha }} \
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Tag Frontend Image
        run: |
          docker tag \
            enterprise-quantum-safe-frontend:${{ github.sha }} \
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

      - name: Push Backend Image
        run: |
          docker push \
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

      - name: Push Frontend Image
        run: |
          docker push \
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

      - name: Publish Deployment Information
        run: |
          echo "Backend:"
          echo "${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}"

          echo "Frontend:"
          echo "${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}"


  # ============================================================
  # 12. INFRASTRUCTURE / CONFIGURATION SCANNING
  # ============================================================

  iac-scan:
    name: IaC and Configuration Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trivy Configuration Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
