
name: Enterprise Quantum-Safe DevSecOps

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_PREFIX: ghcr.io/naveedurrehman959/enterprise-quantum-safe-platform

  DOCKERHUB_IMAGE_PREFIX: naveedurehman/enterprise-quantum-safe

  BACKEND_IMAGE: enterprise-quantum-safe-backend
  FRONTEND_IMAGE: enterprise-quantum-safe-frontend


jobs:

  # ============================================================
  # 1. DEPENDENCY REVIEW
  # ============================================================

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high


  # ============================================================
  # 2. SECRET SCANNING
  # ============================================================

  secret-scan:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ============================================================
  # 3. SAST - SEMGREP
  # ============================================================

  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            backend \
            frontend


  # ============================================================
  # 4. SAST - BANDIT
  # ============================================================

  bandit:
    name: SAST - Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r backend/app -ll


  # ============================================================
  # 5. BACKEND SCA
  # ============================================================

  backend-sca:
    name: Backend SCA - pip-audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Run pip-audit
        working-directory: backend
        run: |
          pip-audit -r requirements.txt


  # ============================================================
  # 6. FRONTEND SCA
  # ============================================================

  frontend-sca:
    name: Frontend SCA - npm audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=high


  # ============================================================
  # 7. BACKEND TESTS
  # ============================================================

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          pytest -q tests


  # ============================================================
  # 8. FRONTEND LINT + BUILD
  # ============================================================

  frontend-validation:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          npm ci

      - name: ESLint
        run: |
          npm run lint

      - name: Build React Application
        run: |
          npm run build


  # ============================================================
  # 9. SBOM
  # ============================================================

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-quantum-safe-sbom
          path: sbom-cyclonedx.json


  # ============================================================
  # 10. IaC / CONFIGURATION SCANNING
  # ============================================================

  iac-scan:
    name: IaC and Configuration Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Trivy Configuration Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true


  # ============================================================
  # 11. DOCKER BUILD
  # ============================================================

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - semgrep
      - bandit
      - backend-sca
      - frontend-sca
      - backend-tests
      - frontend-validation
      - iac-scan
      - sbom

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ./frontend

      - name: Save Docker Images
        run: |
          docker save \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -o docker-images.tar

      - name: Upload Docker Images
        uses: actions/upload-artifact@v4
        with:
          name: enterprise-docker-images
          path: docker-images.tar


  # ============================================================
  # 12. CONTAINER SECURITY SCANNING
  #
  # TRIVY POLICY: WARNING ONLY
  # ============================================================

  container-scan:
    name: Container Security - Trivy
    runs-on: ubuntu-latest

    needs:
      - docker-build

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-docker-images

      - name: Load Docker Images
        run: |
          docker load -i docker-images.tar

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: enterprise-quantum-safe-backend:${{ github.sha }}
          scanners: vuln
          pkg-types: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: enterprise-quantum-safe-frontend:${{ github.sha }}
          scanners: vuln
          pkg-types: library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: table


  # ============================================================
  # 13. PUBLISH IMAGES
  # ============================================================

  publish-images:
    name: Publish Images to GHCR and Docker Hub
    runs-on: ubuntu-latest

    needs:
      - container-scan

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker Images
        uses: actions/download-artifact@v4
        with:
          name: enterprise-docker-images

      - name: Load Docker Images
        run: |
          docker load -i docker-images.tar


      # --------------------------------------------------------
      # GHCR LOGIN
      # --------------------------------------------------------

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # --------------------------------------------------------
      # DOCKER HUB LOGIN
      # --------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # --------------------------------------------------------
      # VERIFY DOCKER HUB LOGIN
      # --------------------------------------------------------

      - name: Verify Docker Hub Login
        run: |
          echo "Docker Hub authentication completed."
          echo "Docker Hub username: ${{ secrets.DOCKERHUB_USERNAME }}"


      # --------------------------------------------------------
      # TAG IMAGES
      # --------------------------------------------------------

      - name: Tag Images
        run: |
          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ github.sha }}

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ github.sha }}

          docker tag \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-backend:${{ github.sha }}

          docker tag \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-frontend:${{ github.sha }}


      # --------------------------------------------------------
      # PUSH BACKEND TO GHCR
      # --------------------------------------------------------

      - name: Push Backend to GHCR
        run: |
          docker push \
            ${{ env.GHCR_IMAGE_PREFIX }}-backend:${{ github.sha }}


      # --------------------------------------------------------
      # PUSH FRONTEND TO GHCR
      # --------------------------------------------------------

      - name: Push Frontend to GHCR
        run: |
          docker push \
            ${{ env.GHCR_IMAGE_PREFIX }}-frontend:${{ github.sha }}


      # --------------------------------------------------------
      # PUSH BACKEND TO DOCKER HUB
      # --------------------------------------------------------

      - name: Push Backend to Docker Hub
        run: |
          docker push \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-backend:${{ github.sha }}


      # --------------------------------------------------------
      # PUSH FRONTEND TO DOCKER HUB
      # --------------------------------------------------------

      - name: Push Frontend to Docker Hub
        run: |
          docker push \
            ${{ env.DOCKERHUB_IMAGE_PREFIX }}-frontend:${{ github.sha }}
  # ============================================================
  # 14. DEPLOY TO AWS EC2
  # ============================================================

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs:
      - publish-images

    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Validate EC2 secrets
      # --------------------------------------------------------

      - name: Validate EC2 Configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is not configured."
            exit 1
          fi

          if [ -z "$EC2_USERNAME" ]; then
            echo "ERROR: EC2_USERNAME secret is not configured."
            exit 1
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "ERROR: EC2_SSH_KEY secret is not configured."
            exit 1
          fi

          echo "EC2 configuration detected."

      # --------------------------------------------------------
      # Configure SSH
      # --------------------------------------------------------

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          echo "========================================="
          echo "Configuring SSH"
          echo "========================================="

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          echo "Checking SSH private key..."

          if ! ssh-keygen -y \
            -f "$HOME/.ssh/deploy_key" \
            > /dev/null 2>&1; then

            echo "ERROR: EC2_SSH_KEY is not a valid private SSH key."
            exit 1
          fi

          echo "SSH private key format is valid."

          echo "========================================="
          echo "EC2 Connectivity Diagnostics"
          echo "========================================="

          echo "Testing DNS resolution..."

          if getent hosts "$EC2_HOST"; then
            echo "DNS resolution successful."
          else
            echo "WARNING: DNS resolution failed."
          fi

          echo ""
          echo "Testing TCP port 22..."

          if timeout 10 bash -c "</dev/tcp/$EC2_HOST/22" 2>/dev/null; then
            echo "TCP port 22 is reachable."
          else
            echo "ERROR: TCP port 22 is NOT reachable."
            exit 1
          fi

          echo ""
          echo "Scanning SSH host key..."

          rm -f "$HOME/.ssh/known_hosts"

          if ! ssh-keyscan \
            -T 15 \
            -p 22 \
            -H \
            "$EC2_HOST" \
            > "$HOME/.ssh/known_hosts" \
            2>/tmp/ssh-keyscan-error.log; then

            echo "ERROR: ssh-keyscan failed."
            cat /tmp/ssh-keyscan-error.log || true
            exit 1
          fi

          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "ERROR: No SSH host key was returned."
            exit 1
          fi

          chmod 644 "$HOME/.ssh/known_hosts"

          echo "SSH host key successfully obtained."

          echo ""
          echo "Testing SSH authentication..."

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USERNAME@$EC2_HOST" \
            "echo 'SSH authentication successful.'"

          echo "SSH configuration completed successfully."

      # --------------------------------------------------------
      # Upload deployment configuration
      # --------------------------------------------------------

      - name: Upload Deployment Configuration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Uploading Deployment Configuration"
          echo "=========================================="

          echo "Checking required local files..."

          if [ ! -f docker-compose.yml ]; then
            echo "ERROR: docker-compose.yml does not exist in repository."
            exit 1
          fi

          if [ ! -f docker/nginx/default.conf ]; then
            echo "ERROR: docker/nginx/default.conf does not exist."
            exit 1
          fi

          if [ ! -f monitoring/prometheus/prometheus.yml ]; then
            echo "ERROR: monitoring/prometheus/prometheus.yml does not exist."
            exit 1
          fi

          echo "All required deployment files found."

          echo "Creating directories on EC2..."

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$EC2_USERNAME@$EC2_HOST" \
            "mkdir -p \
              ~/enterprise-quantum-safe-platform/docker/nginx \
              ~/enterprise-quantum-safe-platform/monitoring/prometheus"

          echo "Uploading docker-compose.yml..."

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            docker-compose.yml \
            "$EC2_USERNAME@$EC2_HOST:~/enterprise-quantum-safe-platform/docker-compose.yml"

          echo "Uploading Nginx configuration..."

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            docker/nginx/default.conf \
            "$EC2_USERNAME@$EC2_HOST:~/enterprise-quantum-safe-platform/docker/nginx/default.conf"

          echo "Uploading Prometheus configuration..."

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            monitoring/prometheus/prometheus.yml \
            "$EC2_USERNAME@$EC2_HOST:~/enterprise-quantum-safe-platform/monitoring/prometheus/prometheus.yml"

          echo "=========================================="
          echo "Deployment configuration uploaded."
          echo "=========================================="
      # --------------------------------------------------------
      # Deploy Application
      # --------------------------------------------------------

      - name: Deploy Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}

          IMAGE_TAG: ${{ github.sha }}

          DOCKERHUB_BACKEND: naveedurehman/enterprise-quantum-safe-backend
          DOCKERHUB_FRONTEND: naveedurehman/enterprise-quantum-safe-frontend

          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

          TLS_CERT: ${{ secrets.TLS_CERT }}
          TLS_PRIVATE_KEY: ${{ secrets.TLS_PRIVATE_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Quantum-Safe Platform Deployment"
          echo "=========================================="

          echo "Image tag:"
          echo "$IMAGE_TAG"

          echo "Target:"
          echo "$EC2_USERNAME@$EC2_HOST"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$EC2_USERNAME@$EC2_HOST" \
            "IMAGE_TAG='$IMAGE_TAG' \
             DOCKERHUB_BACKEND='$DOCKERHUB_BACKEND' \
             DOCKERHUB_FRONTEND='$DOCKERHUB_FRONTEND' \
             DOCKERHUB_USERNAME='$DOCKERHUB_USERNAME' \
             DOCKERHUB_TOKEN='$DOCKERHUB_TOKEN' \
             POSTGRES_DB='$POSTGRES_DB' \
             POSTGRES_USER='$POSTGRES_USER' \
             POSTGRES_PASSWORD='$POSTGRES_PASSWORD' \
             TLS_CERT='$TLS_CERT' \
             TLS_PRIVATE_KEY='$TLS_PRIVATE_KEY' \
             bash -s" <<'REMOTE_SCRIPT'

          set -euo pipefail

          # ======================================================
          # VARIABLES
          # ======================================================

          DEPLOY_DIR="$HOME/enterprise-quantum-safe-platform"

          cd "$DEPLOY_DIR"

          echo "=========================================="
          echo "Deployment Directory"
          echo "=========================================="

          pwd


          # ======================================================
          # VALIDATE REQUIRED FILES
          # ======================================================

          echo "=========================================="
          echo "Validating Deployment Files"
          echo "=========================================="

          REQUIRED_FILES=(
            "docker-compose.yml"
            "docker/nginx/default.conf"
            "monitoring/prometheus/prometheus.yml"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file not found: $file"
              exit 1
            fi
          done

          echo "All required deployment files exist."


          # ======================================================
          # VALIDATE REQUIRED ENVIRONMENT VARIABLES
          # ======================================================

          echo "=========================================="
          echo "Validating Deployment Variables"
          echo "=========================================="

          REQUIRED_VARS=(
            IMAGE_TAG
            DOCKERHUB_BACKEND
            DOCKERHUB_FRONTEND
            DOCKERHUB_USERNAME
            DOCKERHUB_TOKEN
            POSTGRES_DB
            POSTGRES_USER
            POSTGRES_PASSWORD
            TLS_CERT
            TLS_PRIVATE_KEY
          )

          for var in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: Required variable is empty: $var"
              exit 1
            fi
          done

          echo "All required deployment variables are present."


          # ======================================================
          # PREPARE TLS
          # ======================================================

          echo "=========================================="
          echo "Preparing TLS"
          echo "=========================================="

          mkdir -p docker/nginx/ssl

          printf '%s\n' "$TLS_CERT" \
            > docker/nginx/ssl/server.crt

          printf '%s\n' "$TLS_PRIVATE_KEY" \
            > docker/nginx/ssl/server.key

          chmod 644 docker/nginx/ssl/server.crt
          chmod 600 docker/nginx/ssl/server.key

          echo "TLS files created."


          # ======================================================
          # VALIDATE TLS CERTIFICATE
          # ======================================================

          echo "=========================================="
          echo "Validating TLS Certificate"
          echo "=========================================="

          if ! openssl x509 \
            -in docker/nginx/ssl/server.crt \
            -noout \
            -subject \
            -issuer \
            -dates; then

            echo "ERROR: TLS certificate is invalid."
            exit 1
          fi

          echo "TLS certificate is valid."


          # ======================================================
          # VALIDATE TLS PRIVATE KEY
          # ======================================================

          echo "=========================================="
          echo "Validating TLS Private Key"
          echo "=========================================="

          if ! openssl pkey \
            -in docker/nginx/ssl/server.key \
            -noout; then

            echo "ERROR: TLS private key is invalid."
            exit 1
          fi

          echo "TLS private key is valid."


          # ======================================================
          # VERIFY CERTIFICATE / KEY MATCH
          # ======================================================

          echo "=========================================="
          echo "Checking TLS Certificate / Key Match"
          echo "=========================================="

          CERT_PUBLIC_KEY=$(
            openssl x509 \
              -in docker/nginx/ssl/server.crt \
              -pubkey \
              -noout |
            openssl pkey -pubin -outform DER 2>/dev/null |
            sha256sum |
            awk '{print $1}'
          )

          KEY_PUBLIC_KEY=$(
            openssl pkey \
              -in docker/nginx/ssl/server.key \
              -pubout 2>/dev/null |
            openssl pkey -pubin -outform DER 2>/dev/null |
            sha256sum |
            awk '{print $1}'
          )

          if [ "$CERT_PUBLIC_KEY" != "$KEY_PUBLIC_KEY" ]; then
            echo "ERROR: TLS certificate and private key do NOT match."
            echo "Deployment stopped to prevent Nginx SSL failure."
            exit 1
          fi

          echo "TLS certificate and private key match."


          # ======================================================
          # DOCKER HUB LOGIN
          # ======================================================

          echo "=========================================="
          echo "Docker Hub Login"
          echo "=========================================="

          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

          echo "Docker Hub authentication successful."


          # ======================================================
          # CREATE DEPLOYMENT .ENV
          # ======================================================

          echo "=========================================="
          echo "Creating Deployment Environment"
          echo "=========================================="

          umask 077

          cat > .env <<EOF
IMAGE_TAG=$IMAGE_TAG
POSTGRES_DB=$POSTGRES_DB
POSTGRES_USER=$POSTGRES_USER
POSTGRES_PASSWORD=$POSTGRES_PASSWORD
EOF

          chmod 600 .env

          echo "Deployment .env created."


          # ======================================================
          # VALIDATE DOCKER COMPOSE
          # ======================================================

          echo "=========================================="
          echo "Validating Docker Compose"
          echo "=========================================="

          docker compose config -q

          echo "Docker Compose configuration is valid."


          # ======================================================
          # PULL NEW APPLICATION IMAGES
          # ======================================================

          echo "=========================================="
          echo "Pulling Backend Image"
          echo "=========================================="

          docker pull \
            "$DOCKERHUB_BACKEND:$IMAGE_TAG"


          echo "=========================================="
          echo "Pulling Frontend Image"
          echo "=========================================="

          docker pull \
            "$DOCKERHUB_FRONTEND:$IMAGE_TAG"


          # ======================================================
          # START POSTGRESQL
          #
          # IMPORTANT:
          # Do NOT remove postgres_data.
          # Existing database data is preserved.
          # ======================================================

          echo "=========================================="
          echo "Starting PostgreSQL"
          echo "=========================================="

          docker compose up -d postgres


          # ======================================================
          # WAIT FOR POSTGRESQL
          # ======================================================

          echo "=========================================="
          echo "Waiting for PostgreSQL"
          echo "=========================================="

          POSTGRES_READY=false

          for i in {1..30}; do

            if docker compose exec -T postgres \
              pg_isready \
              -U "$POSTGRES_USER" \
              -d "$POSTGRES_DB" \
              >/dev/null 2>&1; then

              echo "PostgreSQL is ready."
              POSTGRES_READY=true
              break

            fi

            echo "PostgreSQL not ready yet... attempt $i/30"

            sleep 2

          done

          if [ "$POSTGRES_READY" != "true" ]; then

            echo "ERROR: PostgreSQL did not become ready."

            echo "PostgreSQL logs:"
            docker compose logs postgres --tail=100 || true

            exit 1

          fi


          # ======================================================
          # VERIFY DATABASE CONNECTION
          # ======================================================

          echo "=========================================="
          echo "Verifying Database Connection"
          echo "=========================================="

          docker compose exec -T postgres \
            psql \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -c "SELECT current_user, current_database();"

          echo "Database connection successful."


          # ======================================================
          # DATABASE MIGRATIONS
          #
          # flask db upgrade is SAFE to run repeatedly.
          # Already-applied migrations are skipped.
          # New migrations are applied automatically.
          # ======================================================

          echo "=========================================="
          echo "Running Database Migrations"
          echo "=========================================="

          docker compose run \
            --rm \
            --no-deps \
            backend \
            flask db upgrade

          echo "Database migration completed successfully."


          # ======================================================
          # START / UPDATE APPLICATION STACK
          # ======================================================

          echo "=========================================="
          echo "Starting Production Stack"
          echo "=========================================="

          docker compose up -d \
            --remove-orphans

          echo "Production stack started."


          # ======================================================
          # WAIT FOR CONTAINERS
          # ======================================================

          echo "=========================================="
          echo "Waiting for Application Containers"
          echo "=========================================="

          sleep 10


          # ======================================================
          # CONTAINER STATUS
          # ======================================================

          echo "=========================================="
          echo "Container Status"
          echo "=========================================="

          docker compose ps


          # ======================================================
          # VERIFY REQUIRED CONTAINERS
          # ======================================================

          echo "=========================================="
          echo "Verifying Required Containers"
          echo "=========================================="

          REQUIRED_SERVICES=(
            postgres
            backend
            frontend
            nginx
            prometheus
            grafana
          )

          for service in "${REQUIRED_SERVICES[@]}"; do

            CONTAINER_ID=$(
              docker compose ps \
                -q "$service" 2>/dev/null || true
            )

            if [ -z "$CONTAINER_ID" ]; then
              echo "ERROR: Service has no container: $service"
              docker compose ps
              exit 1
            fi

            STATUS=$(
              docker inspect \
                --format '{{.State.Status}}' \
                "$CONTAINER_ID"
            )

            if [ "$STATUS" != "running" ]; then

              echo "ERROR: Service is not running: $service"
              echo "Status: $STATUS"

              docker compose logs \
                --tail=100 \
                "$service" || true

              exit 1

            fi

            echo "$service: running"

          done


          # ======================================================
          # NGINX CONFIGURATION TEST
          # ======================================================

          echo "=========================================="
          echo "Testing Nginx Configuration"
          echo "=========================================="

          if ! docker compose exec -T nginx nginx -t; then

            echo "ERROR: Nginx configuration test failed."

            docker compose logs nginx --tail=100 || true

            exit 1

          fi

          echo "Nginx configuration is valid."


          # ======================================================
          # DATABASE VERIFICATION
          # ======================================================

          echo "=========================================="
          echo "Database Verification"
          echo "=========================================="

          docker compose exec -T postgres \
            psql \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -c "SELECT current_user, current_database();"


          # ======================================================
          # MIGRATION VERSION
          # ======================================================

          echo "=========================================="
          echo "Migration Verification"
          echo "=========================================="

          docker compose exec -T postgres \
            psql \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            -c "SELECT version_num FROM alembic_version;" \
            || echo "WARNING: alembic_version table not available."


          # ======================================================
          # APPLICATION HEALTH CHECK
          # ======================================================

          echo "=========================================="
          echo "Application Health Check"
          echo "=========================================="

          BACKEND_HEALTHY=false

          for i in {1..15}; do

            if curl \
              --silent \
              --fail \
              --max-time 5 \
              http://127.0.0.1:5001/health \
              >/dev/null 2>&1; then

              echo "Backend health check successful."
              BACKEND_HEALTHY=true
              break

            fi

            echo "Backend not ready yet... attempt $i/15"
            sleep 2

          done

          if [ "$BACKEND_HEALTHY" != "true" ]; then

            echo "WARNING: /health endpoint was not reachable."

            echo "Backend logs:"
            docker compose logs backend --tail=100 || true

          fi


          # ======================================================
          # FINAL STATUS
          # ======================================================

          echo "=========================================="
          echo "Final Container Status"
          echo "=========================================="

          docker compose ps


          # ======================================================
          # CLEAN OLD UNUSED IMAGES
          # ======================================================

          echo "=========================================="
          echo "Cleaning Unused Docker Images"
          echo "=========================================="

          docker image prune -f


          echo "=========================================="
          echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
          echo "=========================================="

          REMOTE_SCRIPT
