services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:16
    container_name: quantum-safe-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    restart: unless-stopped

    networks:
      - quantum-safe-network


  # ============================================================
  # Backend
  # ============================================================

  backend:
    image: naveedurehman/enterprise-quantum-safe-backend:${IMAGE_TAG}

    container_name: quantum-safe-backend

    ports:
      - "5001:5001"

    environment:
      FLASK_ENV: production
      FLASK_APP: wsgi.py
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1',5001),3); s.close()"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    restart: unless-stopped

    networks:
      - quantum-safe-network


  # ============================================================
  # Frontend
  # ============================================================

  frontend:
    image: naveedurehman/enterprise-quantum-safe-frontend:${IMAGE_TAG}

    container_name: quantum-safe-frontend

    ports:
      - "3001:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - quantum-safe-network


  # ============================================================
  # NGINX
  # ============================================================

  nginx:
    image: nginx:alpine

    container_name: quantum-safe-nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      frontend:
        condition: service_started

      backend:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - quantum-safe-network


  # ============================================================
  # Prometheus
  # ============================================================

  prometheus:
    image: prom/prometheus:latest

    container_name: quantum-safe-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - quantum-safe-network


  # ============================================================
  # Grafana
  # ============================================================

  grafana:
    image: grafana/grafana-oss:latest

    container_name: quantum-safe-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      prometheus:
        condition: service_started

    restart: unless-stopped

    networks:
      - quantum-safe-network


# ==============================================================
# Volumes
# ==============================================================

volumes:
  postgres_data:
  grafana_data:


# ==============================================================
# Network
# ==============================================================

networks:
  quantum-safe-network:
    name: quantum-safe-network
    driver: bridge
