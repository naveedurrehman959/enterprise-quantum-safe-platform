services:

  prometheus:
    image: prom/prometheus:latest
    container_name: quantum-safe-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - backend

    restart: unless-stopped


  grafana:
    image: grafana/grafana-oss:latest
    container_name: quantum-safe-grafana

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped


  postgres:
    image: postgres:16
    container_name: quantum-safe-postgres

    environment:
      POSTGRES_DB: enterprise_qs
      POSTGRES_USER: qs_admin
      POSTGRES_PASSWORD: qs_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: quantum-safe-backend

    ports:
      - "5001:5001"

    environment:
      FLASK_ENV: production
      FLASK_APP: wsgi.py
      DATABASE_URL: postgresql://qs_admin:qs_password@postgres:5432/enterprise_qs

    depends_on:
      - postgres

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: quantum-safe-frontend

    ports:
      - "3001:80"

    depends_on:
      - backend

    restart: unless-stopped
  nginx:
    image: nginx:alpine
    container_name: quantum-safe-nginx

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      - frontend
      - backend

    restart: unless-stopped
volumes:
  postgres_data:
  grafana_data: 
