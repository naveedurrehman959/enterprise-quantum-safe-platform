global:
  resolve_timeout: 5m

route:
  receiver: "default-receiver"

receivers:
  - name: "default-receiver"

    # Future integrations:
    # email_configs:
    # slack_configs:
    # webhook_configs:

inhibit_rules:
  - source_match:
      severity: "critical"

    target_match:
      severity: "warning"

    equal:
      - alertname
