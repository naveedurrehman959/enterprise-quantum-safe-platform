services:

  prometheus:
    image: prom/prometheus
    container_name: prometheus

    network_mode: host

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    restart: unless-stopped


  grafana:
    image: grafana/grafana-oss
    container_name: grafana

    network_mode: host

    restart: unless-stopped

    depends_on:
      - prometheus
